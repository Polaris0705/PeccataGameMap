<style>
:root{--bg:#13100e;--panel:#1e1916;--panel2:#272019;--line:#4a3c2c;--gold:#c9a96a;--gold2:#e6cf9a;--text:#e9e1d4;--muted:#9d907e;--wine:#8a2433;--wine2:#b13a4b;--green:#5f8a5a;--green2:#9cc48f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#231b15 0%,var(--bg) 60%);color:var(--text);font-family:'Noto Serif KR',serif;min-height:100vh;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
#callBar{padding-top:calc(12px + env(safe-area-inset-top))!important}
body.kp .wrap{max-width:1400px}
body.insched .wrap{padding-bottom:4px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
header.top h1{margin:0;font-size:1.3rem;letter-spacing:.1em;color:var(--gold2);font-weight:800}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem}
.coin{font-weight:800;color:var(--gold2)}.coin::before{content:"◈ ";color:var(--gold)}
.demo{background:var(--wine);color:#fff;font-size:.72rem;padding:1px 8px;border-radius:10px}
nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
nav.sub{margin-bottom:14px}
nav button{flex:1 1 auto;min-width:70px;padding:8px 6px}
.navlabel{font-size:.72rem;color:var(--muted);letter-spacing:.2em;margin:4px 0 3px}
button{font-family:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.9rem;transition:.15s}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold2)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--wine);border-color:var(--wine2);color:#fff}
button.primary{background:var(--gold);color:#1a140e;border-color:var(--gold);font-weight:600}
button.primary:hover:not(:disabled){background:var(--gold2);color:#1a140e}
button.danger{color:var(--wine2)}
button.sm{padding:4px 9px;font-size:.8rem}
.badge{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.badge.pending{border-color:var(--gold);color:var(--gold2)}.badge.approved{border-color:var(--green);color:var(--green2)}.badge.rejected,.badge.cancelled{border-color:var(--wine2);color:var(--wine2)}
.badge.live{background:var(--wine);color:#fff;border-color:var(--wine2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:1.1rem;color:var(--gold2)}
.panel h3{margin:14px 0 6px;font-size:.98rem;color:var(--gold)}
.muted{color:var(--muted);font-size:.86rem}
.grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
input,textarea,select{font-family:inherit;background:#0f0c0a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.93rem;width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggles{display:flex;gap:5px;flex-wrap:wrap}
.toggles button{padding:5px 10px;font-size:.85rem}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:7px 0}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.namecard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:10px;background:var(--panel2);border:2px solid var(--line)}
.namecard .sig{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;font-weight:800;background:#0f0c0a;border:1px solid var(--gold);color:var(--gold2);flex:none;overflow:hidden}
.namecard .sig img{width:100%;height:100%;object-fit:cover}
.namecard .t{color:var(--gold);font-size:.82rem}.namecard .n{font-size:1.15rem;font-weight:800}
.frame-silver{border-color:#c8cdd2!important;box-shadow:0 0 10px rgba(200,205,210,.25)}
.frame-gold{border-color:#e2bd5c!important;box-shadow:0 0 14px rgba(226,189,92,.35)}
.frame-blood{border-color:#a3142a!important;box-shadow:0 0 16px rgba(163,20,42,.5)}
.frame-moon{border-color:#9fb7e8!important;box-shadow:0 0 16px rgba(159,183,232,.45)}
.plot{background:#18130f;border:1px dashed var(--line);border-radius:10px;padding:12px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.plot .icon{font-size:2rem}.plot.ready{border:1px solid var(--green);box-shadow:0 0 12px rgba(95,138,90,.35)}
.prog{height:6px;background:#0d0a08;border-radius:3px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2))}
.room{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:left}
.room.solved{border-color:var(--gold)}.room .no{color:var(--gold);font-size:.8rem}.room .rn{font-weight:800}
.choice{display:block;width:100%;text-align:left;margin:6px 0}
.hintbox{background:#14100c;border-left:3px solid var(--gold);padding:8px 10px;margin:6px 0;font-size:.9rem}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.inv .slotx{background:#18130f;border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.inv .slotx:hover{border-color:var(--gold)}
.inv img,.thumb{width:76px;height:76px;object-fit:cover;border-radius:6px;background:#0f0c0a}
.noimg{width:76px;height:76px;border-radius:6px;background:#0f0c0a;display:grid;place-items:center;font-size:1.8rem}
.inv .slotx.sel{border-color:var(--wine2);box-shadow:0 0 10px rgba(177,58,75,.5)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wine2);margin-left:4px;vertical-align:middle}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.note.kpnote{border-color:var(--gold)}
.note .m{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}th{color:var(--gold);font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
#modal .box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;max-width:540px;width:100%;max-height:88vh;overflow:auto;padding:18px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:#1a140e;padding:10px 18px;border-radius:20px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#callBar{position:sticky;top:0;z-index:25;display:none;background:linear-gradient(90deg,var(--wine),#5a1520);color:#fff;padding:12px 14px;border-bottom:2px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.5)}
#callBar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#callBar b{font-size:1.05rem}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(230,207,154,0)}50%{box-shadow:0 0 22px rgba(230,207,154,.7)}}
#callBar{animation:pulse 1.4s infinite}
#schedWrap{display:none;padding:0 14px 20px}
#schedWrap iframe{width:100%;height:calc(100vh - 170px);min-height:560px;border:1px solid var(--line);border-radius:10px;background:#fff}
.story{white-space:pre-line}
.auth{max-width:420px;margin:30px auto}
.mapbox{position:relative}
#plMap{width:100%;display:block;border-radius:8px;cursor:pointer}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;border:1px solid var(--line);margin:3px;font-size:.85rem;cursor:pointer}
.qitem{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.chat{display:grid;grid-template-columns:210px 1fr;gap:10px;height:calc(100vh - 210px);min-height:440px}
.chanlist{overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px}
.chsec{font-size:.72rem;color:var(--muted);letter-spacing:.15em;margin:8px 4px 2px}
.chan{text-align:left;padding:7px 9px;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.chan.add{color:var(--gold2);border-style:dashed}
.chatmain{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0}
.chathead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#chatLog{flex:1;overflow-y:auto;padding:10px 12px;min-height:0}
.chatin{border-top:1px solid var(--line);padding:8px}
.inrow{display:flex;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.spkw{flex:0 0 auto}
.chatin textarea{width:auto;min-height:40px;max-height:140px;resize:none;flex:1 1 120px;min-width:0;padding:9px 10px;line-height:1.4}
.chatin .spk{width:auto;max-width:130px;padding:7px 6px;font-size:.85rem}
.iconbtn{flex:0 0 auto;display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;font-size:1.05rem}
.dicebar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.editbar{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--gold2);margin-bottom:6px}
.msg{display:flex;gap:9px;margin:9px 0;cursor:default}
.msg.grp{margin-top:2px}
.msg .av{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;background:#0f0c0a;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--gold2)}
.msg.grp .av{height:0;border:none;background:none}
.msg .av img{width:100%;height:100%;object-fit:cover}
.msg .mb{min-width:0;flex:1}
.msg .nm{font-size:.84rem;color:var(--gold2);font-weight:600}
.msg .nm span{cursor:pointer}
.msg .nm small{color:var(--muted);font-weight:400;margin-left:2px}
.mt{font-size:.7rem;color:var(--muted);font-weight:400;margin-left:4px}
.msg .tx{word-break:break-word;line-height:1.55}
.msg.ooc .tx{color:#a99f90;font-size:.9rem}
.msg.ooc .nm{color:#a99f90}
.msg.ooc .av{opacity:.6}
.msg.narr{justify-content:center}
.msg.narr .nb{max-width:92%;text-align:center;padding:8px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#d8cdb8;font-style:italic}
.msg.tome .mb,.msg.tome .nb{background:rgba(201,169,106,.08);border-radius:6px}
.msg.sys{justify-content:center}
.paren{color:#8a8274}
.act{color:#c9bc9f}
.mention{color:var(--gold2);background:rgba(201,169,106,.16);border-radius:4px;padding:0 3px}
.mimg{max-width:260px;max-height:260px;border-radius:8px;margin-top:4px;cursor:zoom-in;display:block}
.macts{display:flex;gap:5px;margin-top:4px}
.dice{display:inline-block;background:#14100c;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:4px}
.dtot{font-size:1.25rem;color:var(--gold2)}
.dres{font-weight:700;padding:1px 8px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.dice.crit,.dice.ext{border-color:#e2bd5c}.dice.crit .dres,.dice.ext .dres{background:#e2bd5c;color:#1a140e}
.dice.hard .dres,.dice.ok .dres{color:var(--green2);border-color:var(--green)}
.dice.fail .dres{color:#b9ae9c}
.dice.fumble{border-color:var(--wine2)}.dice.fumble .dres{background:var(--wine);color:#fff}
@media(max-width:760px){.chat{grid-template-columns:1fr;height:auto}.chanlist{flex-direction:row;overflow-x:auto;padding:6px}.chsec{display:none}
 .chatmain{height:calc(100vh - 290px);min-height:380px}.inrow{flex-wrap:wrap}.spkw{flex:1 1 100%}.chatin .spk{max-width:none;width:100%}.mimg{max-width:200px}}
@media(max-width:760px){#schedWrap{padding:0 4px 10px}#schedWrap iframe{height:86vh;min-height:0;border-radius:6px}.schedinfo{font-size:.78rem}}
</style>
</head>

<script>

const isAdminEmail = e => ADMINS.includes(String(e||'').toLowerCase());

const HOS = [

  {id:'lust',   name:'색욕', perk:'다음 미니게임에서 공개'}
];

const SEEDS = [
  {id:'mint',  name:'박하',      icon:'🌿', cost:5,   min:3,  sell:12},
  {id:'rose',  name:'장미',      icon:'🌹', cost:15,  min:10, sell:40},
  {id:'lav',   name:'라벤더',    icon:'💜', cost:30,  min:20, sell:85},
  {id:'lily',  name:'달빛 백합', icon:'🤍', cost:60,  min:45, sell:190},
  {id:'mand',  name:'맨드레이크',icon:'🥀', cost:100, min:90, sell:360}
];
const PLOT_COST = [50,120,250]; // 4,5,6번째 화단

const RIDDLES = [
 {id:'r1',room:'현관',reward:30,type:'num',ans:7.5,unit:'초',
  q:'현관의 괘종시계는 3시를 알릴 때, 첫 번째 종부터 마지막 종이 울리기까지 3초가 걸린다.\n같은 빠르기로 6시를 알린다면, 첫 종부터 마지막 종까지 몇 초가 걸릴까?',
  hints:['종소리 자체보다 종과 종 사이의 "간격"에 주목하세요.','3번 울릴 때 간격은 2개. 간격 하나는 1.5초예요.','6번 울리면 간격은 5개예요.']},
 {id:'r2',room:'서재',reward:40,type:'num',ans:5,unit:'cm',
  q:'서재 책장에 서양식 백과사전 3권이 책등이 보이도록 왼쪽부터 1권, 2권, 3권 순서로 꽂혀 있다.\n각 권의 본문 두께는 3cm, 앞표지와 뒤표지는 각각 0.5cm.\n책벌레가 1권의 첫 페이지부터 3권의 마지막 페이지까지 일직선으로 갉아먹었다면, 책벌레가 지나간 거리는 몇 cm일까?',
  hints:['책장에 꽂힌 1권의 "첫 페이지"는 실제로 책의 어느 쪽에 있을까요?','책등이 보이게 꽂으면, 1권의 첫 페이지는 오른쪽(2권 쪽)에 붙어 있어요.','1권의 앞표지 + 2권 전체 + 3권의 뒤표지만 지나가요.']},
 {id:'r3',room:'식당',reward:30,type:'choice',ans:1,

 {id:'r4',room:'응접실',reward:30,type:'num',ans:21,unit:'번',

 {id:'r5',room:'온실',reward:30,type:'num',ans:29,unit:'일',
  q:'온실 연못의 수련은 하루마다 덮은 면적이 2배로 늘어난다.\n30일째에 연못이 수련으로 가득 찼다면, 연못의 절반이 덮인 날은 며칠째일까?',

let B=null;
async function makeFirebase(){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [AP,A,F]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const app=AP.initializeApp(CONFIG.firebase), auth=A.getAuth(app), db=F.getFirestore(app);
  const ref=p=>F.doc(db,...p.split('/'));
  const list=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  return {
    onAuth:cb=>A.onAuthStateChanged(auth,u=>cb(u&&{uid:u.uid,email:(u.email||'').toLowerCase(),name:u.displayName||''})),
    signUp:async(e,p,n)=>{const c=await A.createUserWithEmailAndPassword(auth,e,p);try{await A.updateProfile(c.user,{displayName:n});}catch(x){}return c.user.uid;},
    signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
    google:async()=>{const pv=new A.GoogleAuthProvider();pv.setCustomParameters({prompt:'select_account'});
      try{await A.signInWithPopup(auth,pv);}
      catch(e){if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))await A.signInWithRedirect(auth,pv);else throw e;}},
    signOut:()=>A.signOut(auth),
    resetPw:e=>A.sendPasswordResetEmail(auth,e),
    get:async p=>{const s=await F.getDoc(ref(p));return s.exists()?s.data():null;},
    set:(p,d,m)=>F.setDoc(ref(p),d,m?{merge:true}:{}),
    update:(p,d)=>F.updateDoc(ref(p),d),
    del:p=>F.deleteDoc(ref(p)),
    add:async(c,d)=>(await F.addDoc(F.collection(db,c),d)).id,
    onDoc:(p,cb)=>F.onSnapshot(ref(p),s=>cb(s.exists()?s.data():null),e=>console.warn(p,e)),
    onCol:(c,cb)=>F.onSnapshot(F.collection(db,c),s=>cb(list(s)),e=>console.warn(c,e)),
    onQuery:(c,o,cb)=>F.onSnapshot(F.query(F.collection(db,c),F.orderBy(o.orderBy),F.limitToLast(o.limit)),s=>cb(list(s)),e=>console.warn(c,e)),
    getCol:async c=>list(await F.getDocs(F.collection(db,c))),
    batch:async ops=>{const b=F.writeBatch(db);ops.forEach(o=>{if(o.op==='set')b.set(ref(o.path),o.data);else if(o.op==='del')b.delete(ref(o.path));else b.update(ref(o.path),o.data);});await b.commit();}
  };
}
function makeMock(){
  const K='peccata_mockdb', AK='peccata_mockauth';
  const load=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}');}catch(e){return {};}};
  let D=load();const subsD=[],subsC=[];let authCb=null;
  const bc=('BroadcastChannel' in window)?new BroadcastChannel('peccata_mock'):null;
  const clone=x=>x==null?null:JSON.parse(JSON.stringify(x));
  const list=c=>{const n=c.split('/').length+1;return Object.keys(D).filter(k=>k.startsWith(c+'/')&&k.split('/').length===n).map(k=>({id:k.split('/').pop(),...clone(D[k])}));};
  const qlist=(c,o)=>list(c).sort((a,b)=>(a[o.orderBy]||0)-(b[o.orderBy]||0)).slice(-o.limit);
  function fire(){
    subsD.slice().forEach(s=>{const v=JSON.stringify(D[s.p]??null);if(v!==s.last){s.last=v;s.cb(clone(D[s.p]??null));}});
    subsC.slice().forEach(s=>{const l=s.o?qlist(s.c,s.o):list(s.c),v=JSON.stringify(l);if(v!==s.last){s.last=v;s.cb(l);}});
  }
  const persist=()=>{try{localStorage.setItem(K,JSON.stringify(D));}catch(e){console.warn('데모 저장공간 초과',e);}bc&&bc.postMessage(1);setTimeout(fire,0);};
  if(bc)bc.onmessage=()=>{D=load();fire();};
  const authDB=()=>{try{return JSON.parse(localStorage.getItem(AK)||'{}');}catch(e){return {};}};
  const setCur=u=>{u?sessionStorage.setItem('peccata_cur',JSON.stringify(u)):sessionStorage.removeItem('peccata_cur');authCb&&authCb(u);};
  return {
    onAuth:cb=>{authCb=cb;let cur=null;try{cur=JSON.parse(sessionStorage.getItem('peccata_cur')||'null');}catch(e){}setTimeout(()=>cb(cur),0);},
    signUp:async(e,p,n)=>{const A=authDB();if(A[e])throw{code:'auth/email-already-in-use'};if(p.length<6)throw{code:'auth/weak-password'};
      const u={uid:'u'+Math.random().toString(36).slice(2,10),email:e,name:n};A[e]={...u,pw:p};localStorage.setItem(AK,JSON.stringify(A));setCur(u);return u.uid;},
    signIn:async(e,p)=>{const a=authDB()[e];if(!a||a.pw!==p)throw{code:'auth/invalid-credential'};setCur({uid:a.uid,email:a.email,name:a.name});},
    google:async(email,name)=>{const A=authDB();let a=A[email];
      if(!a){a={uid:'g'+Math.random().toString(36).slice(2,10),email,name,pw:null};A[email]=a;localStorage.setItem(AK,JSON.stringify(A));}
      setCur({uid:a.uid,email:a.email,name:a.name||name});},
    signOut:async()=>setCur(null),
    resetPw:async()=>{},
    get:async p=>clone(D[p]??null),
    set:async(p,d,m)=>{D[p]=m?{...(D[p]||{}),...clone(d)}:clone(d);persist();},
    update:async(p,d)=>{if(!D[p])throw new Error('문서 없음');D[p]={...D[p],...clone(d)};persist();},
    del:async p=>{delete D[p];persist();},
    add:async(c,d)=>{const id=Math.random().toString(36).slice(2,12);D[c+'/'+id]=clone(d);persist();return id;},
    onDoc:(p,cb)=>{const s={p,cb,last:undefined};subsD.push(s);setTimeout(()=>{s.last=JSON.stringify(D[p]??null);cb(clone(D[p]??null));},0);return()=>{const i=subsD.indexOf(s);if(i>=0)subsD.splice(i,1);};},
    onCol:(c,cb)=>{const s={c,cb,last:undefined};subsC.push(s);setTimeout(()=>{const l=list(c);s.last=JSON.stringify(l);cb(l);},0);return()=>{const i=subsC.indexOf(s);if(i>=0)subsC.splice(i,1);};},
    onQuery:(c,o,cb)=>{const s={c,o,cb,last:undefined};subsC.push(s);setTimeout(()=>{const l=qlist(c,o);s.last=JSON.stringify(l);cb(l);},0);return()=>{const i=subsC.indexOf(s);if(i>=0)subsC.splice(i,1);};},
    getCol:async c=>list(c),
    batch:async ops=>{ops.forEach(o=>{if(o.op==='set')D[o.path]=clone(o.data);else if(o.op==='del')delete D[o.path];else D[o.path]={...(D[o.path]||{}),...clone(o.data)};});persist();}
  };
}

function compressImage(dataURL,max,q){return new Promise(res=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let out=c.toDataURL('image/webp',q);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/jpeg',q);res(out);};img.onerror=()=>res('');img.src=dataURL;});}

   ${maps.length?`<div class="mapbox" style="margin-top:10px"><canvas id="plMap"></canvas><p class="muted" id="mapLoading">지도를 불러오는 중…</p></div><p class="muted">표시된 장소를 누르면 그 장소로 조사를 예약할 수 있어요.</p>`:''}
   ${loose.length?`<h3>그 밖의 장소</h3>${loose.map(p=>`<span class="chip" style="border-color:${p.color}" onclick="bookAt(PUB.places[${places.indexOf(p)}].name)">${esc(p.name)}</span>`).join('')}`:''}</div>`;
};
async function drawPlMap(){
  const cv=$('#plMap');if(!cv||!mapSel)return;
  const key=mapSel,img=MAPIMG[key];
  if(!img){MAPIMG[key]='loading';const data=await loadMapData(key);
    if(!data){delete MAPIMG[key];const l=$('#mapLoading');if(l)l.textContent='지도를 불러오지 못했어요. 잠시 후 다시 열어 주세요.';return;}
    const im=new Image();im.onload=()=>{MAPIMG[key]=im;if(tab==='map')drawPlMap();};im.src=data;return;}
  if(img==='loading')return;
  const W=cv.parentElement.clientWidth,sc=W/img.width;cv.width=W;cv.height=Math.round(img.height*sc);
  const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
  const pls=((PUB&&PUB.places)||[]).filter(p=>p.mapKey===key&&p.nx!=null);
  pls.forEach(p=>{const x=p.nx*cv.width,y=p.ny*cv.height,w=p.nw*cv.width,h=p.nh*cv.height;
    ctx.fillStyle=p.color+'33';ctx.fillRect(x,y,w,h);ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.setLineDash([5,3]);ctx.strokeRect(x,y,w,h);ctx.setLineDash([]);
    ctx.font='bold 13px "Noto Serif KR",serif';const tw=ctx.measureText(p.name).width;ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(x+3,y+3,tw+8,19);ctx.fillStyle='#fff';ctx.fillText(p.name,x+7,y+17);});
  const l=$('#mapLoading');if(l)l.style.display='none';
  cv.onclick=e=>{const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width,my=(e.clientY-r.top)/r.height;
    const hit=pls.slice().reverse().find(p=>mx>=p.nx&&mx<=p.nx+p.nw&&my>=p.ny&&my<=p.ny+p.nh);if(hit)bookAt(hit.name);};
}

function busyOf(code,d,s){
  const o=PUB&&PUB.occ&&PUB.occ[code];if(o&&o['d'+d+'s'+s])return '일정 있음';
  const dp=PUB&&PUB.dep&&PUB.dep[code];if(dp&&(d>dp.day||(d===dp.day&&s>=dp.slot)))return '이탈';
  return '';
}

}

   <label class="f">함께 갈 사람 (나 포함 2인 이상)</label><div class="toggles"><button class="on" disabled>${esc(cname(me))} (나)</button>${partBtns}</div>
   <label class="f">하고 싶은 행동 (선택)</label><input maxlength="80" value="${esc(BK.note)}" oninput="BK.note=this.value" placeholder="예: 책장 뒤를 살펴본다">

   ${mine.length?mine.map(b=>bookingCard(b,{actions:(b.uid===ME.uid&&b.status==='pending')?`<button class="sm danger" onclick="cancelBooking('${b.id}')">취소</button>`:''})).join(''):'<p class="muted">아직 예약이 없어요.</p>'}</div>`;

VIEWS.garden=()=>{
  const now=Date.now();let h='';
  for(let i=0;i<6;i++){
    if(i>=P.plotCount){
      if(i===P.plotCount){const c=PLOT_COST[i-3];h+=`<div class="plot"><div class="icon">🔒</div><div class="muted">새 화단</div><button onclick="buyPlot()" ${P.coins<c?'disabled':''}>${c} 은화로 개간</button></div>`;}
      else h+=`<div class="plot" style="opacity:.35"><div class="icon">🔒</div><div class="muted">잠김</div><div></div></div>`;continue;}
    const p=P.plots[i];
    if(!p.seed){h+=`<div class="plot"><div class="icon">🟫</div><div class="muted">빈 화단</div><button onclick="seedPick(${i})">씨앗 심기</button></div>`;continue;}
    const sd=SEEDS.find(s=>s.id===p.seed),el=now-p.start,pct=Math.min(100,el/p.dur*100);

    else h+=`<div class="plot"><div class="icon" style="filter:grayscale(.6)">🌱</div><div><b>${sd.name}</b><div class="prog"><i style="width:${pct}%"></i></div><div class="muted">${fmt(p.dur-el)} 남음</div></div><div></div></div>`;
  }

    b+=`<p class="muted" style="margin-top:10px">현재 보상: ${curReward(r)} 은화 · 오답 ${st.wrong}회</p>`;

function answer(id,choice){
  const r=RIDDLES.find(x=>x.id===id),st=rs(id);let ok=false;
  if(r.type==='choice')ok=choice===r.ans;
  else{const v=($('#ans')||{}).value||'';if(!v.trim())return toast('답을 입력해 주세요');
    if(r.type==='num'){const m=v.replace(/,/g,'').match(/-?\d+(\.\d+)?/);ok=!!m&&Math.abs(parseFloat(m[0])-r.ans)<1e-9;}
    else ok=v.replace(/\D/g,'').replace(/^0+/,'')===r.ans;}
  if(ok){const g=curReward(r);st.solved=true;st.got=g;earn(g);render();openRiddle(id);toast(`정답! +${g} 은화`);}
  else{st.wrong++;saveP();render();openRiddle(id);toast('아쉽지만 틀렸어요…');}
}

let schedWin=null;
const CLIENT_ID=rid();
window.KPBridge={
  clientId:CLIENT_ID,
  ready(win){
    schedWin=win;let first=true;
    B.get('assets/portraits').then(a=>{
      if(a)win.__applyAssets(a);
      unsubs.push(B.onDoc('sched/main',async d=>{
        if(first){first=false;if(d&&d.state)await win.__applyRemote(JSON.parse(d.state));win.__startSync();return;}
        if(d&&d.state&&d.writer!==CLIENT_ID)win.__applyRemote(JSON.parse(d.state));
      }));
      unsubs.push(B.onDoc('assets/portraits',a=>{if(a)win.__applyAssets(a);}));
    });
  },
  saveSched(st){
    B.set('sched/main',{state:JSON.stringify(st),writer:CLIENT_ID,at:Date.now()}).catch(e=>toast('스케줄 저장 실패: '+(e.code||e.message)));
    B.set('public/main',derivePublic(st)).catch(()=>{});
  },
  async uploadMap(key,name,dataURL){
    try{const c=await compressImage(dataURL,1600,.8);const CH=700000,n=Math.ceil(c.length/CH);
      const ops=[{op:'set',path:'maps/'+key,data:{name,n,at:Date.now()}}];
      for(let i=0;i<n;i++)ops.push({op:'set',path:'mapchunks/'+key+'_'+i,data:{d:c.slice(i*CH,(i+1)*CH)}});
      for(let i=0;i<ops.length;i+=3)await B.batch(ops.slice(i,i+3));
    }catch(e){toast('맵 업로드 실패: '+(e.code||e.message));}
  },
  loadMap:key=>loadMapData(key),
  async saveAssets(portraits,tokens){
    const out={portraits:{},tokens:{}};
    for(const [c,v] of Object.entries(portraits||{}))out.portraits[c]=await compressImage(v,96,.8);
    for(const [c,v] of Object.entries(tokens||{}))out.tokens[c]=await compressImage(v,64,.8);
    B.set('assets/portraits',out).catch(()=>{});
  }
};
function derivePublic(st){
  const maps=(st.maps||[]);
  const color=n=>(st.customColors||{})[n]||PAL[((st.pcIdx||{})[n]??0)%8];
  const occ={};
  Object.entries(st.schedule||{}).forEach(([c,o])=>{const k=Object.keys(o||{});if(k.length){occ[c]={};k.forEach(x=>occ[c][x]=1);}});
  const dep={};Object.entries(st.departures||{}).forEach(([c,d])=>dep[c]={day:d.day,slot:d.slot});
  return clean({
    days:st.days,slotsPerDay:st.slotsPerDay,dayNames:st.dayNames,names:st.names,
    maps:maps.filter(m=>m.revealed).map(m=>({key:m.key,name:m.name})),
    places:(st.places||[]).filter(p=>p.revealed).map(p=>{const m=p.mapIdx!=null?maps[p.mapIdx]:null;const on=m&&m.revealed;
      return {name:p.name,color:color(p.name),mapKey:on?m.key:null,nx:on?p.nx??null:null,ny:on?p.ny??null:null,nw:on?p.nw??null:null,nh:on?p.nh??null:null};}),
    occ,dep,at:Date.now()
  });
}

   ${DEFS.length>=2?`<div class="row"><select onchange="RCF.a=this.value"><option value="">재료 A</option>${opt(RCF.a)}</select><span>+</span><select onchange="RCF.b=this.value"><option value="">재료 B</option>${opt(RCF.b)}</select><span>→</span><select onchange="RCF.r=this.value"><option value="">결과</option>${opt(RCF.r)}</select></div>
   <label class="muted" style="display:block;margin:6px 0"><input type="checkbox" style="width:auto" ${RCF.consume?'checked':''} onchange="RCF.consume=this.checked"> 재료는 조합하면 사라짐</label><button onclick="saveRecipe()">조합법 추가</button>`:'<p class="muted">아이템을 2개 이상 만들면 조합법을 정할 수 있어요.</p>'}
   ${RECIPES.map(r=>`<div class="card"><div class="h"><div>${esc((defOf(r.a)||{}).name||'?')} + ${esc((defOf(r.b)||{}).name||'?')} → <b>${esc(r.name)}</b>${r.consume===false?' <span class="muted">(재료 유지)</span>':''}</div><button class="sm danger" onclick="B.del('recipes/${r.id}')">삭제</button></div></div>`).join('')}</div>
  <div class="panel"><h2>지급된 물건 (${ITEMS.length})</h2><table><tr><th>물건</th><th>가진 사람</th><th>상태</th><th></th></tr>
   ${ITEMS.map(i=>`<tr><td>${esc(i.name)}${i.via?' <span class="muted">(조합)</span>':''}</td><td>${esc(i.ownerName||(userOf(i.owner)?uname(userOf(i.owner)):''))}</td><td>${i.revealed?'✦ 공개됨':i.inspectReq?'🔍 요청':''}</td><td style="white-space:nowrap">${!i.revealed?`<button class="sm" onclick="revealItem('${i.id}')">숨은 글 공개</button>`:''}<button class="sm danger" onclick="if(confirm('회수할까요?'))B.del('items/${i.id}')">회수</button></td></tr>`).join('')}</table></div>`;
};
async function itemImg(inp){const f=inp.files[0];if(!f)return;ITF.img=await compressImage(await readFile(f),480,.8);render();}
async function saveDef(){
  if(!ITF.name.trim())return toast('이름을 입력해 주세요');
  const d=clean({name:ITF.name.trim(),desc:ITF.desc.trim(),hidden:ITF.hidden.trim(),img:ITF.img||''});
  if(ITF.id){await B.update('itemDefs/'+ITF.id,d);
    const rs=RECIPES.filter(r=>r.result===ITF.id);for(const r of rs)await B.update('recipes/'+r.id,{name:d.name,desc:d.desc,img:d.img});}
  else await B.add('itemDefs',{...d,at:Date.now()});
  ITF={id:null,name:'',desc:'',hidden:'',img:''};render();toast('저장했어요');
}
function editDef(id){const d=defOf(id);ITF={id,name:d.name,desc:d.desc||'',hidden:d.hidden||'',img:d.img||''};render();window.scrollTo(0,0);}
async function delDef(id){if(!confirm('아이템 정의를 삭제할까요? (이미 지급된 물건은 남아요)'))return;await B.del('itemDefs/'+id);for(const r of RECIPES.filter(r=>r.a===id||r.b===id||r.result===id))await B.del('recipes/'+r.id);}
async function giveDef(id){const d=defOf(id),uid=$('#give_'+id).value,u=userOf(uid);
  await B.add('items',clean({defId:id,owner:uid,ownerName:uname(u),name:d.name,desc:d.desc||'',img:d.img||'',revealed:false,seen:false,at:Date.now()}));toast(`${uname(u)}에게 「${d.name}」 지급`);}
async function revealItem(id){const it=ITEMS.find(x=>x.id===id),d=defOf(it.defId);
  if(!d||!d.hidden){toast('숨은 글이 없는 아이템이에요');await B.update('items/'+id,{inspectReq:false});return;}
  await B.update('items/'+id,{revealed:true,hiddenText:d.hidden,inspectReq:false});toast('숨은 글을 공개했어요');}
async function saveRecipe(){const {a,b,r,consume}=RCF;if(!a||!b||!r)return toast('재료 2개와 결과를 골라 주세요');if(a===b)return toast('서로 다른 재료를 골라 주세요');
  const d=defOf(r),k=[a,b].sort().join('__');
  await B.set('recipes/'+k,clean({a,b,result:r,name:d.name,desc:d.desc||'',img:d.img||'',consume}));RCF={a:'',b:'',r:'',consume:true};render();toast('조합법을 추가했어요');}

/* ================= KP: 플레이어 ================= */
VIEWS.players=()=>{
  const rows=rankRows();
  return `<div class="panel"><h2>플레이어 · 랭킹</h2><p class="muted">HO를 바꾸면 PL 화면에 바로 반영돼요. 미니게임 1등 혜택은 여기 누적 은화를 보고 정해 주세요.</p>
  <div style="overflow-x:auto"><table><tr><th>#</th><th>이름</th><th>HO</th><th>보유</th><th>누적</th><th>수수께끼</th><th></th></tr>
  ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(uname(r.u))}<div class="muted" style="font-size:.75rem">${esc(r.u.email||'')}</div></td>
   <td><select style="width:auto" onchange="B.update('users/${r.u.id}',{ho:this.value})"><option value="">-</option>${HO_CODES.map(c=>{const t=usersWithHo(c).find(x=>x.id!==r.u.id);return `<option value="${c}" ${r.u.ho===c?'selected':''} ${t?'disabled':''}>${esc(cname(c))}</option>`;}).join('')}</select>${isAdminEmail(r.u.email)?' <span class="badge">KP</span>':''}</td>
   <td>${r.coins}</td><td><b>${r.earned}</b></td><td>${r.solved}/${RIDDLES.length}</td><td><button class="sm" onclick="callAsk('${r.u.id}')">🔔</button></td></tr>`).join('')}</table></div></div>
  ${appPanel()}
  <div class="panel"><h2>KP 계정</h2><p class="muted">KP도 HO를 배정받으면 PL처럼 소지품·조사 예약·미니게임 특전·랭킹·호출에 함께 들어가요.</p>
   ${USERS.filter(u=>isAdminEmail(u.email)).map(u=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(uname(u))} <span class="muted">${esc(u.email)}</span></span>
   <select style="width:auto" onchange="B.update('users/${u.id}',{ho:this.value})"><option value="">HO 없음</option>${HO_CODES.map(c=>{const t=usersWithHo(c).find(x=>x.id!==u.id);return `<option value="${c}" ${u.ho===c?'selected':''} ${t?'disabled':''}>${esc(cname(c))}${t?' ('+esc(uname(t))+')':''}</option>`;}).join('')}</select></div>`).join('')}</div>`;
};

setInterval(()=>{if(ME&&P&&(tab==='garden'||tab==='lobby')&&!modalOpen())softRender();},1000);
</script>
