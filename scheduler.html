<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Peccata Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f7f5f2;--bg2:#ffffff;--bg3:#f0ede8;--bg4:#e8e4de;
  --border:#d8d2c8;--border2:#c4bdb0;
  --text:#2a2520;--text2:#6b6058;--text3:#a09890;
  --accent:#8b5e2a;--accent2:#c8954a;--accent3:#fdf3e3;
  --red:#b83232;--red2:#fdf0f0;--green:#2a7a4a;--blue:#2a5a9b;--purple:#6a3a9b;
  --font:'Noto Serif KR','나눔명조',Georgia,serif;--mono:'Courier New',monospace;
  --font-size-base:15px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--font-size-base);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.app{display:flex;flex-direction:column;flex:1;overflow:hidden;}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;}
.header h1{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.03em;}
.header-tabs{display:flex;gap:3px;margin-left:auto;}
.tab-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:4px 12px;cursor:pointer;font-size:12px;border-radius:3px;font-family:var(--font);transition:all .15s;}
.tab-btn.active{background:var(--accent3);border-color:var(--accent2);color:var(--accent);}
.tab-btn:hover:not(.active){border-color:var(--border2);color:var(--text);}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:200px;min-width:200px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.panel{display:none;flex-direction:column;flex:1;overflow:hidden;}
.panel.active{display:flex;}

/* SIDEBAR */
.sidebar-section{border-bottom:1px solid var(--border);}
.sidebar-title{padding:5px 10px;font-size:10px;letter-spacing:.1em;color:var(--text2);text-transform:uppercase;font-family:var(--font);background:var(--bg3);border-bottom:1px solid var(--border);}
.char-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border);transition:background .1s;}
.char-item:hover{background:var(--bg3);}
.portrait-wrap{width:36px;height:36px;position:relative;flex-shrink:0;cursor:pointer;border-radius:5px;overflow:hidden;border:1px solid var(--border2);}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.portrait-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--font);}
.portrait-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:3;}
.portrait-hover{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;opacity:0;transition:opacity .15s;z-index:2;}
.portrait-wrap:hover .portrait-hover{opacity:1;}
.portrait-hover span{color:#fff;font-size:7px;font-family:var(--font);}
.token-wrap{width:22px;height:22px;position:relative;flex-shrink:0;border-radius:50%;overflow:hidden;border:1px solid var(--border2);cursor:pointer;}
.token-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.token-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:var(--font);}
.token-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:3;}
.token-hover{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;z-index:2;border-radius:50%;}
.token-wrap:hover .token-hover{opacity:1;}
.token-hover span{color:#fff;font-size:7px;font-family:var(--font);}
.char-info{flex:1;min-width:0;}
.char-name{font-size:12px;color:var(--text);white-space:normal;word-break:keep-all;overflow-wrap:break-word;line-height:1.3;cursor:pointer;transition:color .1s;}
.char-name:hover{color:var(--accent);}
.char-code{font-size:9px;color:var(--text3);font-family:var(--font);}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.s-free{background:var(--green);}.s-partial{background:var(--accent);}.s-busy{background:var(--red);}
.sb-footer{padding:7px 10px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);flex-shrink:0;}

/* SCHEDULE */
.schedule-wrap{padding:10px;flex:1;overflow:auto;display:flex;flex-direction:column;}
.sch-day-hdr{display:flex;padding-left:150px;margin-bottom:2px;}
.sch-slot-hdr{display:flex;padding-left:150px;margin-bottom:6px;}
.day-hcol{text-align:center;font-size:11px;color:var(--text2);font-family:var(--font);}
.slot-hcol{flex:1;text-align:center;font-size:10px;color:var(--text3);font-family:var(--font);display:flex;justify-content:center;gap:3px;align-items:center;}
.slot-hcol .sl-num,.slot-hcol .sl-tod{cursor:pointer;padding:0 2px;}
.slot-hcol .sl-tod{font-size:11px;opacity:.85}
.slot-hcol.now{background:var(--accent3);color:var(--accent);font-weight:700;outline:1px solid var(--accent2);}
.sch-row{display:flex;align-items:stretch;margin-bottom:3px;flex:1;min-height:32px;}
.row-label{width:150px;min-width:150px;display:flex;align-items:center;gap:4px;padding-right:6px;justify-content:flex-end;align-self:center;}
.row-limg{width:26px;height:26px;border-radius:3px;object-fit:cover;border:1px solid var(--border2);}
.row-lph{width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--font);}
.row-lname{font-size:11px;color:var(--text2);text-align:right;max-width:100px;white-space:normal;word-break:keep-all;overflow-wrap:break-word;line-height:1.3;}
.cells{display:flex;flex:1;gap:2px;align-items:stretch;}
.slot{flex:1;min-height:32px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;overflow:hidden;}
.slot.departed{background:repeating-linear-gradient(45deg,var(--bg3),var(--bg3) 4px,var(--bg4) 4px,var(--bg4) 8px);border-color:var(--border2);cursor:not-allowed;opacity:.7;}
.char-name.departed-name{text-decoration:line-through;color:var(--text3);}
.slot:hover{border-color:var(--border2);background:var(--bg4);}
.slot.fixed-ev{background:#fdf0f0;border-color:var(--red);cursor:not-allowed;}
.slot.filled{border-color:transparent;}
.slot-in{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;gap:1px;}
.slot-txt{font-size:9px;line-height:1.1;text-align:center;overflow:hidden;white-space:nowrap;width:100%;padding:0 2px;}
.slot-pimgs{display:flex;gap:1px;justify-content:center;}
.slot-pimg{width:18px;height:18px;border-radius:50%;object-fit:cover;border:1px solid rgba(0,0,0,.15);box-shadow:0 1px 3px rgba(0,0,0,.15);}
.day-gap{width:5px;flex-shrink:0;background:var(--bg);align-self:stretch;}
.sc0{background:#fff8ec;border-color:#e0b86a!important;color:#8b5e2a;}
.sc1{background:#edf7f2;border-color:#6abf96!important;color:#1e7a4a;}
.sc2{background:#edf2fb;border-color:#6a9ae0!important;color:#1e4a9b;}
.sc3{background:#f5edfb;border-color:#a87ad4!important;color:#5a2a9b;}
.sc4{background:#fbedec;border-color:#d48080!important;color:#8b2a2a;}
.sc5{background:#edfafa;border-color:#6abfbf!important;color:#1e6a6a;}
.sc6{background:#faf8ec;border-color:#d4c46a!important;color:#7a6a1e;}
.sc7{background:#f5edf8;border-color:#b47ac8!important;color:#6a1e8b;}
.action-bar{background:var(--bg2);border-top:1px solid var(--border);padding:6px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
.btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:5px 12px;cursor:pointer;font-size:12px;border-radius:3px;font-family:var(--font);transition:all .15s;}
.btn:hover{border-color:var(--border2);color:var(--text);}
.btn.pri{border-color:var(--accent2);color:var(--accent);background:var(--accent3);}
.btn.pri:hover{background:var(--accent2);color:#fff;}
.btn.dng{border-color:#e0a0a0;color:var(--red);}
.btn.sm{padding:3px 8px;font-size:11px;}
.btn.active-state{background:var(--accent3);border-color:var(--accent2);color:var(--accent);}
.vmsg{font-size:11px;padding:3px 7px;font-family:var(--font);}
.ok{color:var(--green);}.err{color:var(--red);}

/* MODAL */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:20px;min-width:300px;max-width:520px;width:94%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15);}
.modal h3{font-size:15px;color:var(--accent);margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:7px;}
.frow{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;}
.frow label{font-size:10px;color:var(--text2);font-family:var(--font);text-transform:uppercase;letter-spacing:.05em;}
.frow select,.frow input[type=text],.frow input[type=number]{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 9px;border-radius:3px;font-size:13px;font-family:var(--font);width:100%;}
.frow select:focus,.frow input:focus{outline:none;border-color:var(--accent2);}
.tog-grid{display:flex;flex-wrap:wrap;gap:4px;}
.tog{padding:4px 8px;border:1px solid var(--border);border-radius:3px;cursor:pointer;font-size:11px;background:transparent;color:var(--text2);font-family:var(--font);display:flex;align-items:center;gap:4px;transition:all .1s;}
.tog.sel{color:var(--accent);border-color:var(--accent2);background:var(--accent3);}
.tog.dis{color:var(--text3);border-color:var(--border);cursor:not-allowed;opacity:.4;}
.tog img{width:18px;height:18px;border-radius:50%;object-fit:cover;}
.tog-ph{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:var(--font);}
.modal-btns{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;}
.merr{font-size:11px;color:var(--red);margin-top:3px;font-family:var(--font);min-height:16px;}

/* MAP */
.map-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.map-toolbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
.map-tabs-row{background:var(--bg3);border-bottom:1px solid var(--border);padding:4px 10px;display:flex;gap:4px;align-items:center;flex-shrink:0;overflow-x:auto;}
.map-tab{padding:3px 10px;border:1px solid var(--border);border-radius:3px;cursor:pointer;font-size:11px;background:transparent;color:var(--text2);font-family:var(--font);white-space:nowrap;}
.map-tab.active{background:var(--accent3);border-color:var(--accent2);color:var(--accent);}
.map-body{display:flex;flex:1;overflow:hidden;}
.map-canvas-wrap{flex:1;background:#e8e4de;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.map-canvas-wrap.zoomed{display:block;overflow:auto;}
.map-canvas-wrap.zoomed canvas{margin:5px;}
#mapCanvas{touch-action:none;}
.mzs{display:inline-flex;gap:2px;align-items:center}.mzs b{font-size:11px;min-width:36px;text-align:center;font-family:var(--font);color:var(--text2)}
.no-map-hint{color:var(--text3);font-size:13px;text-align:center;font-style:italic;}
canvas{display:none;}
.places-sidebar{width:185px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.place-list-wrap{flex:1;overflow-y:auto;padding:5px;}
/* 장소 아이템 */
.place-item{border:1px solid var(--border);border-radius:4px;margin-bottom:4px;overflow:hidden;background:var(--bg2);}
.folder-group{margin-bottom:6px;}
.folder-header{display:flex;align-items:center;gap:5px;padding:4px 7px;cursor:pointer;background:var(--bg3);border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--text2);user-select:none;}
.folder-header:hover{background:var(--bg4);}
.folder-icon{font-size:12px;transition:transform .15s;}
.folder-icon.open{transform:rotate(90deg);}
.folder-items{padding-left:8px;margin-top:2px;}
.folder-count{font-size:10px;color:var(--text3);margin-left:auto;}
.place-item-head{display:flex;align-items:center;gap:5px;padding:5px 7px;cursor:pointer;transition:background .1s;}
.place-item-head:hover{background:var(--bg3);}
.place-item.selected .place-item-head{background:var(--accent3);}
.place-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;cursor:pointer;}
.place-item-name{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.place-item-actions{display:none;background:var(--bg3);border-top:1px solid var(--border);padding:4px 7px;display:flex;gap:4px;flex-wrap:wrap;}
.place-action-btn{font-size:10px;padding:2px 6px;border:1px solid var(--border);border-radius:3px;cursor:pointer;background:var(--bg2);color:var(--text2);font-family:var(--font);transition:all .1s;}
.place-action-btn:hover{border-color:var(--border2);color:var(--text);}
.place-action-btn.del{color:var(--red);border-color:#e0a0a0;}
.place-tokens{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px;}

/* TOOLTIP */
.map-tooltip{position:absolute;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:11px;pointer-events:none;z-index:100;max-width:210px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;}
.map-tooltip h4{font-size:12px;color:var(--accent);margin-bottom:5px;font-family:var(--font);}
.tt-tokens{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.tt-token{display:flex;align-items:center;gap:3px;font-size:10px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:2px 5px;}
.tt-token img{width:16px;height:16px;border-radius:50%;object-fit:cover;}
.tt-token-ph{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-family:var(--font);}

/* SUMMARY */
.sum-wrap{flex:1;overflow:auto;display:flex;flex-direction:column;}
.sum-sub-tabs{display:flex;gap:4px;padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.sum-stab{padding:4px 12px;border:1px solid var(--border);border-radius:3px;cursor:pointer;font-size:12px;background:transparent;color:var(--text2);font-family:var(--font);}
.sum-stab.active{background:var(--accent3);border-color:var(--accent2);color:var(--accent);}
.sum-content{flex:1;overflow-y:auto;padding:10px;}
.sum-day{margin-bottom:14px;}
.sum-day h4{font-size:12px;color:var(--accent);font-family:var(--font);margin-bottom:5px;border-bottom:1px solid var(--border);padding-bottom:3px;}
.sum-row{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px;}
.sum-char{width:140px;min-width:140px;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.sum-cimg{width:22px;height:22px;border-radius:3px;object-fit:cover;flex-shrink:0;}
.sum-cph{width:22px;height:22px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:var(--font);flex-shrink:0;}
.sum-cname{font-size:11px;white-space:normal;word-break:keep-all;overflow-wrap:break-word;line-height:1.3;}
.sum-slots{display:flex;gap:3px;flex-wrap:wrap;align-items:center;padding-top:2px;}
.sum-slot{padding:2px 6px;border-radius:2px;font-size:10px;font-family:var(--font);}
.sum-place-block{background:var(--bg2);border:1px solid var(--border);border-radius:4px;margin-bottom:10px;overflow:hidden;}
.sum-place-head{padding:7px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
.sum-place-body{padding:8px 12px;}
.sum-place-day{margin-bottom:8px;}
.sum-place-day h5{font-size:11px;color:var(--text2);font-family:var(--font);margin-bottom:4px;}
.sum-place-entry{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;border-bottom:1px solid var(--border);}
.sum-place-slot{width:44px;font-size:10px;color:var(--text3);font-family:var(--font);flex-shrink:0;}
.sum-place-chars{display:flex;gap:4px;flex-wrap:wrap;}
.char-tag{display:flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:10px;font-family:var(--font);}

/* COND EVENTS */
.cev-panel{flex:1;overflow-y:auto;padding:10px;}
.cev-block{background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden;}
.cev-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);}
.cev-status{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cev-status.achieved{background:var(--green);}
.cev-status.partial{background:var(--accent);}
.cev-status.pending{background:var(--border2);}
.cev-title{font-size:13px;font-weight:600;flex:1;}
.cev-body{padding:8px 12px;font-size:11px;color:var(--text2);display:flex;flex-direction:column;gap:6px;}
.cev-cond-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.cev-cond-tag{padding:2px 7px;border-radius:3px;font-size:10px;border:1px solid var(--border);}
.cev-progress{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:2px;}
.cev-progress-bar{height:100%;border-radius:3px;transition:width .3s;}
.cev-slot-mark{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;margin:1px;}
/* 일정표 상단 이벤트 배너 */
.cev-banner{padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:0;}
.cev-badge{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;border:1px solid;cursor:pointer;transition:all .1s;}
.cev-badge:hover{opacity:.8;}
.cev-badge.achieved{background:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent);border-color:var(--green);color:var(--green);}
.cev-badge.partial{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:var(--accent);color:var(--accent);}
.cev-badge.pending{background:var(--bg3);border-color:var(--border2);color:var(--text3);}

/* SETTINGS PANEL */
.settings-wrap{flex:1;overflow-y:auto;padding:16px;}
.settings-section{background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-bottom:14px;overflow:hidden;}
.settings-section-title{background:var(--bg3);padding:8px 14px;font-size:11px;font-family:var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--text2);border-bottom:1px solid var(--border);}
.settings-body{padding:14px;display:flex;flex-direction:column;gap:10px;}
.setting-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.setting-label{width:130px;font-size:12px;color:var(--text2);flex-shrink:0;}
.setting-input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:3px;font-size:13px;font-family:var(--font);}
.setting-input:focus{outline:none;border-color:var(--accent2);}
.color-input{width:48px;height:32px;border:1px solid var(--border);border-radius:3px;cursor:pointer;padding:2px;background:var(--bg2);}
/* HSL 슬라이더 피커 */
.hsl-picker{display:flex;flex-direction:column;gap:6px;min-width:220px;}
.hsl-row{display:flex;align-items:center;gap:8px;}
.hsl-label{width:14px;font-size:10px;color:var(--text3);font-family:var(--font);flex-shrink:0;}
.hsl-slider{flex:1;height:10px;border-radius:5px;appearance:none;-webkit-appearance:none;cursor:pointer;border:none;outline:none;}
.hsl-slider::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.3);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);}

<style id="appThemeVars"></style>
<script>
/* 앱 테마 따라가기: 부모(앱)의 색·글꼴·도트 스타일을 그대로 가져와요 */
(function(){
  let PD=null;try{PD=(window.parent&&window.parent!==window)?window.parent.document:null;}catch(e){}
  window.followApp=()=>{try{return localStorage.getItem('peccata_sched_follow')!=='0';}catch(e){return true;}};
  window.setFollowApp=v=>{try{localStorage.setItem('peccata_sched_follow',v?'1':'0');}catch(e){}window.syncAppTheme();if(!v&&typeof applyTheme==='function')applyTheme();if(typeof renderSettings==='function'&&document.getElementById('settingsWrap'))try{renderSettings();}catch(e){}};
  window.syncAppTheme=()=>{
    const st=document.getElementById('appThemeVars');
    if(!PD||!followApp()){st.textContent='';document.documentElement.classList.remove('follow','px');return;}
    const cs=getComputedStyle(PD.documentElement),v=n=>cs.getPropertyValue(n).trim();
    const M={bg:'--bg',bg2:'--panel',bg3:'--panel2',bg4:'--inbg',border:'--line',border2:'--frame',text:'--text',text2:'--text2',text3:'--muted',accent:'--gold',accent2:'--gold2',red:'--wine2'};
    let css='html:root,html:root body{';
    Object.entries(M).forEach(([k,p])=>{const x=v(p);if(x)css+=`--${k}:${x}!important;`;});
    css+='--accent3:color-mix(in srgb,var(--accent) 22%,var(--bg2))!important;--red2:color-mix(in srgb,var(--red) 25%,var(--bg2))!important;';
    const f=v('--font');if(f)css+=`--font:${f}!important;`;
    css+='}';st.textContent=css;
    document.documentElement.classList.add('follow');
    document.documentElement.classList.toggle('px',PD.documentElement.classList.contains('px'));
  };
  if(PD){new MutationObserver(()=>syncAppTheme()).observe(PD.documentElement,{attributes:true,attributeFilter:['style','class']});}
  document.addEventListener('DOMContentLoaded',()=>syncAppTheme());
})();
</script>

let S={
  days:1,
  slotsPerDay: [3],          // (1) Day별 슬롯 수 배열
  dayNames: ['Day 0'],
  names: Object.fromEntries(ALL.map(c=>[c,c])),

  tokens: {},
  places: [],                // [{name, mapIdx, x,y,w,h, color?}]

  maps: [],
  curMapIdx: 0,
  departures: {},  // code -> {day, slot, reason}
  tod: {},         // 'd_s' -> morning|day|evening|night (슬롯 시간대)
  now: null,       // {d,s} 지금 진행 중인 슬롯
  condEvents: [],  // [{id, name, place, dayFrom, dayTo, condType, count, note, color}]
  pcIdx: {},
  customColors: {},          // placeName -> custom hex color
  drawMode: false,
  editMode: false,
  showTok: true,
  curMapDay: 0,   // 0=전체, 1~N=해당 Day만
  curSumTab: 'char',
  headerBg: '',
  headerText: '',
  headerFont: '',
  // 설정
  theme:{
    bg:'#f7f5f2',bg2:'#ffffff',bg3:'#f0ede8',bg4:'#e8e4de',
    border:'#d8d2c8',border2:'#c4bdb0',
    text:'#2a2520',text2:'#6b6058',text3:'#a09890',
    accent:'#8b5e2a',accent2:'#c8954a',accent3:'#fdf3e3',
    red:'#b83232',green:'#2a7a4a',
  },
  fontFamily:'Noto Serif KR',
  fontSize:15,
};

/* ═══════════════ HELPERS ═══════════════ */
function pCol(p){
  if(S.customColors[p]) return S.customColors[p];
  if(S.pcIdx[p]===undefined) S.pcIdx[p]=Object.keys(S.pcIdx).length%8;
  return DEFAULT_PCOLS[S.pcIdx[p]];
}
function pIdx(p){if(S.pcIdx[p]===undefined)S.pcIdx[p]=Object.keys(S.pcIdx).length%8;return S.pcIdx[p];}
function key(d,s){return`d${d}s${s}`;}
function getA(c,d,s){return(S.schedule[c]||{})[key(d,s)]||null;}
function setA(c,d,s,v){if(!S.schedule[c])S.schedule[c]={};v===null?delete S.schedule[c][key(d,s)]:S.schedule[c][key(d,s)]=v;}
function slotsOf(d){return S.slotsPerDay[d-1]||3;}  // (1) Day d의 슬롯 수
function isFixed(c,d,s){return false;}  // (4) NPC 이벤트 탭 제거 → 고정 없음
// 이탈: dep.day/dep.slot 기준 그 시점 포함 이후 슬롯 모두 잠김
function isDeparted(c,d,s){
  const dep=S.departures[c];
  if(!dep)return false;
  if(d>dep.day)return true;
  if(d===dep.day&&s>=dep.slot)return true;
  return false;
}
function departureReason(c){return(S.departures[c]||{}).reason||'이탈';}
function departureLabel(c){
  const dep=S.departures[c];if(!dep)return '';
  const dayName=S.dayNames[dep.day-1]||('Day '+(dep.day-1));
  const SYMS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  return`${dayName} ${SYMS[dep.slot-1]||dep.slot}부터`;
}
function filled(c){let n=0;for(let d=1;d<=S.days;d++)for(let s=1;s<=slotsOf(d);s++)if(getA(c,d,s))n++;return n;}
function totalSlots(){let t=0;for(let d=1;d<=S.days;d++)t+=slotsOf(d);return t;}
function isHO(c){return HOS.includes(c);}
function charBg(c){return isHO(c)?'var(--accent3)':'#eef2fb';}
function charFg(c){return isHO(c)?'var(--accent)':'#2a5a9b';}
function charSc(c){return c.replace('NPC','N').replace('HO','');}
function tokenTag(c,size=20){
  const t=S.tokens[c]||S.portraits[c];
  if(t)return`<img style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;" src="${t}">`;
  return`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${charBg(c)};color:${charFg(c)};font-size:${size>14?8:6}px;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:700;">${charSc(c)}</div>`;
}
function portraitTag(c,w=26,h=26,r=3){
  const p=S.portraits[c];
  if(p)return`<img style="width:${w}px;height:${h}px;border-radius:${r}px;object-fit:cover;border:1px solid var(--border2);" src="${p}">`;
  return`<div style="width:${w}px;height:${h}px;border-radius:${r}px;background:${charBg(c)};color:${charFg(c)};font-size:9px;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:700;border:1px solid var(--border);">${charSc(c)}</div>`;
}

/* ═══════════════ THEME ═══════════════ */
function applyTheme(){
  const r=document.documentElement.style;
  const t=S.theme;
  Object.entries(t).forEach(([k,v])=>r.setProperty('--'+k,v));
  r.setProperty('--font',`'${S.fontFamily}','나눔명조',Georgia,serif`);
  r.setProperty('--font-size-base',S.fontSize+'px');
  // body와 html 둘 다 설정 + !important 우회를 위해 style 직접 적용
  document.documentElement.style.fontSize=S.fontSize+'px';
  document.body.style.fontFamily=`'${S.fontFamily}','나눔명조',Georgia,serif`;
  document.body.style.fontSize=S.fontSize+'px';
  // 동적으로 생성되는 내부 요소들도 재렌더
  applyHeaderTheme();
}

/* ═══════════════ SIDEBAR ═══════════════ */
function renderSidebar(){
  let h='';
  [['HO',HOS],['NPC',NPCS]].forEach(([title,codes])=>{
    h+=`<div class="sidebar-section"><div class="sidebar-title">${title}</div>`;
    codes.forEach(c=>{
      const n=filled(c),max=totalSlots();
      const dot=n===0?'s-free':n<max?'s-partial':'s-busy';
      const port=S.portraits[c],tok=S.tokens[c];
      h+=`<div class="char-item">
        <div class="portrait-wrap" title="포트레이트 업로드">
          ${port?`<img src="${port}" alt="">`:`<div class="portrait-ph" style="background:${charBg(c)};color:${charFg(c)};">${charSc(c)}</div>`}
          <div class="portrait-hover"><span>PORT</span></div>
          <input type="file" accept="image/*" onchange="loadPortrait(event,'${c}')">
        </div>
        <div class="token-wrap" title="토큰 업로드">
          ${tok?`<img src="${tok}" alt="">`:`<div class="token-ph" style="background:${charBg(c)};color:${charFg(c)};">${charSc(c)[0]||'?'}</div>`}
          <div class="token-hover"><span>TOK</span></div>
          <input type="file" accept="image/*" onchange="loadToken(event,'${c}')">
        </div>
        <div class="char-info">
          <div class="char-name${S.departures[c]?' departed-name':''}" onclick="openNameEdit('${c}')" title="클릭 → 이름 변경">${S.names[c]}</div>
          ${S.departures[c]?`<div style="font-size:9px;color:var(--text3);">✈ ${departureLabel('${c}')}</div>`:''}
          <div class="char-code">${c}</div>
        </div>
        <div class="status-dot ${dot}"></div>
        <button onclick="event.stopPropagation();openDepartureEdit('${c}')"
          style="background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;opacity:.5;transition:opacity .15s;"
          title="이탈 설정" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.5">✈</button>
      </div>`;
    });
    h+='</div>';
  });
  h+=`<div class="sb-footer">
    <button class="btn sm pri" onclick="addDay()" style="width:100%;">+ Day 추가</button>
    <button class="btn sm dng" onclick="removeDay()" style="width:100%;">− Day 제거</button>
  </div>`;
  document.getElementById('sidebar').innerHTML=h;
}

function loadPortrait(ev,c){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{S.portraits[c]=e.target.result;renderSidebar();renderSchedule();};r.readAsDataURL(f);}
function loadToken(ev,c){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{S.tokens[c]=e.target.result;renderSidebar();renderSchedule();if(S.showTok)redrawMap();};r.readAsDataURL(f);}

/* ═══════════════ NAME EDIT ═══════════════ */
let _nt='';
function openNameEdit(c){
  _nt=c;
  document.getElementById('nmTitle').textContent=`이름 변경 — ${c}`;
  document.getElementById('nmInput').value=S.names[c]||c;
  document.getElementById('nameModal').classList.add('open');
  setTimeout(()=>document.getElementById('nmInput').focus(),60);
}
document.getElementById('nmInput').addEventListener('keydown',e=>{if(e.key==='Enter')confirmName();});
function confirmName(){
  const v=document.getElementById('nmInput').value.trim();
  if(v)S.names[_nt]=v;
  closeOverlay('nameModal');renderSidebar();renderSchedule();
}

/* ═══════════════ DEPARTURE ═══════════════ */
let _depChar='';
let _depMode='slot'; // 'slot' | 'day'
function openDepartureEdit(c){
  _depChar=c;_depMode='slot';
  document.getElementById('depTitle').textContent=`이탈 설정 — ${S.names[c]}`;
  // Day 옵션
  const ds=document.getElementById('depDay');
  ds.innerHTML=Array.from({length:S.days},(_,i)=>`<option value="${i+1}">${S.dayNames[i]||'Day '+i}</option>`).join('');
  // 기존 이탈 있으면 복원
  const dep=S.departures[c];
  if(dep){
    ds.value=dep.day;
    document.getElementById('depReason').value=dep.reason||'';
    if(dep.slot===1&&dep._dayMode){setDepMode('day');}else{setDepMode('slot');}
    rebuildDepSlots(dep.day);
    if(dep.slot)document.getElementById('depSlot').value=dep.slot;
  } else {
    document.getElementById('depReason').value='';
    setDepMode('slot');
    rebuildDepSlots(1);
  }
  ds.onchange=()=>rebuildDepSlots(+ds.value);
  document.getElementById('departureModal').classList.add('open');
}
function setDepMode(mode){
  _depMode=mode;
  document.getElementById('depModeSlot').className='tog'+(mode==='slot'?' sel':'');
  document.getElementById('depModeDay').className='tog'+(mode==='day'?' sel':'');
  document.getElementById('depSlotRow').style.display=mode==='slot'?'':'none';
}
function rebuildDepSlots(d){
  const n=S.slotsPerDay[d-1]||3;
  const SYMS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  document.getElementById('depSlot').innerHTML=
    Array.from({length:n},(_,i)=>`<option value="${i+1}">${SYMS[i]||i+1} 슬롯부터</option>`).join('');
}
function confirmDeparture(){
  const day=+document.getElementById('depDay').value;
  const slot=_depMode==='day'?1:+document.getElementById('depSlot').value;
  const reason=document.getElementById('depReason').value.trim()||'이탈';
  S.departures[_depChar]={day,slot,reason,_dayMode:_depMode==='day'};
  closeOverlay('departureModal');
  renderSchedule();
}
function clearDeparture(){
  delete S.departures[_depChar];
  closeOverlay('departureModal');
  renderSchedule();
}

/* ═══════════════ DAY / SLOT MANAGEMENT ═══════════════ */
function addDay(){
  S.days++;
  S.slotsPerDay.push(3);
  S.dayNames.push('Day '+(S.days-1));
  updateDayLabel();renderSchedule();updateMapDaySelect();
}
function removeDay(){
  if(S.days<=1)return;
  const d=S.days;
  ALL.forEach(c=>{for(let s=1;s<=slotsOf(d);s++)setA(c,d,s,null);});
  S.days--;S.slotsPerDay.pop();S.dayNames.pop();
  if(S.curMapDay>S.days)S.curMapDay=0;
  updateDayLabel();renderSchedule();updateMapDaySelect();
}
function updateDayLabel(){
  const el=document.getElementById('dayLabel');
  if(el)el.textContent=S.dayNames.join(' · ');
}
function openDayNameEdit(idx){
  const name=prompt(`이름 변경:`,S.dayNames[idx]);
  if(name!==null&&name.trim()){S.dayNames[idx]=name.trim();renderSchedule();updateDayLabel();}
}
// (1) 슬롯 수 변경
function changeSlotsForDay(d, newCount){
  const cur=slotsOf(d);
  if(newCount<1||newCount>10)return;
  if(newCount<cur){
    // 줄어든 슬롯 데이터 제거
    for(let s=newCount+1;s<=cur;s++) ALL.forEach(c=>setA(c,d,s,null));
  }
  S.slotsPerDay[d-1]=newCount;
  renderSchedule();
}
function openMapNameEdit(idx){
  const name=prompt(`맵 이름 변경:`,S.maps[idx].name);
  if(name!==null&&name.trim()){S.maps[idx].name=name.trim();renderMapTabs();}
}

/* ═══════════════ 시간대 · 지금 진행 중 ═══════════════ */
const TOD_ORDER=['morning','day','evening','night'],TOD_IC={morning:'🌅',day:'☀️',evening:'🌇',night:'🌙'};
function cycleTod(d,s){S.tod=S.tod||{};const k=d+'_'+s,i=TOD_ORDER.indexOf(S.tod[k]);if(i===TOD_ORDER.length-1)delete S.tod[k];else S.tod[k]=TOD_ORDER[i+1];renderSchedule();}
function setNowSlot(d,s){S.now=(S.now&&S.now.d===d&&S.now.s===s)?null:{d,s};renderSchedule();}

/* ═══════════════ SCHEDULE ═══════════════ */
function renderSchedule(){
  const wrap=document.getElementById('schWrap');
  let h='';
  // Day headers
  h+='<div class="sch-day-hdr">';
  for(let d=1;d<=S.days;d++){
    const slots=slotsOf(d);
    h+=`<div class="day-hcol" style="flex:${slots};--n:${slots};">
      <span style="cursor:pointer;" onclick="openDayNameEdit(${d-1})" title="클릭 → 이름 변경">${S.dayNames[d-1]||'Day '+(d-1)}</span>
      <span onclick="changeSlotsForDay(${d},${slots-1})" style="cursor:pointer;margin-left:4px;font-size:10px;color:var(--text3);" title="슬롯 줄이기">−</span>
      <span style="font-size:10px;color:var(--text3);">${slots}</span>
      <span onclick="changeSlotsForDay(${d},${slots+1})" style="cursor:pointer;font-size:10px;color:var(--text3);" title="슬롯 늘리기">+</span>
    </div>`;
    if(d<S.days)h+='<div style="width:5px;"></div>';
  }
  h+='</div>';
  // Slot sub-headers
  h+='<div class="sch-slot-hdr">';
  const SLOT_SYMS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  for(let d=1;d<=S.days;d++){
    const slots=slotsOf(d);
    for(let s=1;s<=slots;s++){const tk=(S.tod||{})[d+'_'+s],isNow=S.now&&S.now.d===d&&S.now.s===s;
      h+=`<div class="slot-hcol${isNow?' now':''}"><span class="sl-num" onclick="setNowSlot(${d},${s})" title="눌러서 '지금 진행 중'으로 정하기">${isNow?'▶':''}${SLOT_SYMS[s-1]||s}</span><span class="sl-tod" onclick="cycleTod(${d},${s})" title="시간대 바꾸기 (아침→낮→저녁→밤)">${TOD_IC[tk]||'·'}</span></div>`;}
    if(d<S.days)h+='<div style="width:5px;"></div>';
  }
  h+='</div>';
  // Rows
  ALL.forEach(c=>{
    h+=`<div class="sch-row"><div class="row-label">${portraitTag(c)}<div class="row-lname" title="${S.names[c]}">${S.names[c]}</div></div><div class="cells">`;
    for(let d=1;d<=S.days;d++){
      const slots=slotsOf(d);
      for(let s=1;s<=slots;s++){
        const a=getA(c,d,s);
        if(a&&isDeparted(c,d,s)){
          // 이탈 이후인데 기존 배정이 있으면 이탈로 표시
          const reason=departureReason(c);
          h+=`<div class="slot departed" title="${reason}"><div class="slot-in"><div class="slot-txt" style="color:var(--text3);font-size:8px;">✈ ${reason.substring(0,4)}</div></div></div>`;
        } else if(a){
          const ci=pIdx(a.place);
          const pimgs=a.participants.filter(p=>p!==c).slice(0,3).map(p=>tokenTag(p,18)).join('');
          const col=pCol(a.place);
          const isEv=a.stype==='event';
          const badge=isEv?'<span style="font-size:8px;line-height:1;">⚡</span>':'';
          const bg=isEv?col+'10':col+'18';
          const border=isEv?col+'60':col+'80';
          const borderStyle=isEv?`2px dashed ${col}80`:`1px solid ${col}80`;
          h+=`<div class="slot filled" style="background:${bg};border:${borderStyle};" onclick="clickSlot('${c}',${d},${s})" title="${isEv?'[이벤트] ':''}${a.place}${a.action?': '+a.action:''}\n참가: ${a.participants.map(p=>S.names[p]).join(', ')}">
            <div class="slot-in">${badge}<div class="slot-txt" style="color:${col};opacity:${isEv?0.8:1};">${(a.place||'').substring(0,5)}</div>
            <div class="slot-pimgs">${pimgs}</div></div></div>`;
        } else if(isDeparted(c,d,s)){
          const reason=departureReason(c);
          h+=`<div class="slot departed" title="${reason}">
            <div class="slot-in">
              <div class="slot-txt" style="color:var(--text3);font-size:8px;">✈ ${reason.substring(0,4)}</div>
            </div>
          </div>`;
        } else {
          const pb=(window.PENDING||[]).filter(b=>b.day===d&&b.slots.includes(s)&&b.parts.includes(c));
          if(pb.length){
            h+=`<div class="slot pend" onclick="try{parent.KPBridge.review('${pb[0].id}')}catch(e){}" title="신청: ${_esc(pb[0].place)} (${_esc(pb[0].name)})${pb.length>1?' 외 '+(pb.length-1)+'건':''}"><div class="slot-in"><div class="slot-txt" style="font-size:8px;">신청${pb.length>1?'×'+pb.length:''}</div><div class="slot-txt">${_esc((pb[0].place||'').substring(0,5))}</div></div></div>`;
          } else
          h+=`<div class="slot" onclick="openAssignFor('${c}',${d},${s})"><div class="slot-in" style="color:var(--text3);font-size:9px;">—</div></div>`;
        }
      }
      if(d<S.days)h+='<div class="day-gap"></div>';
    }
    h+='</div></div>';
  });
  wrap.innerHTML=h;renderSidebar();validate();renderCevBanner();
}

function clickSlot(c,d,s){
  const a=getA(c,d,s);if(!a)return;
  if(!confirm(`${S.names[c]} ${S.dayNames[d-1]||'Day '+(d-1)}-${s}번 일정 삭제?\n(같은 그룹 전체 삭제)`))return;
  const gid=a.gid;
  ALL.forEach(p=>{const x=getA(p,d,s);if(x&&x.gid===gid)setA(p,d,s,null);});
  renderSchedule();if(S.showTok)redrawMap();
}
function clearAll(){if(confirm('전체 일정 초기화?')){ALL.forEach(c=>{S.schedule[c]={};});renderSchedule();if(S.showTok)redrawMap();}}

function validate(){
  const el=document.getElementById('vmsg');
  const errs=[];
  for(let d=1;d<=S.days;d++)for(let s=1;s<=slotsOf(d);s++)ALL.forEach(c=>{
    const a=getA(c,d,s);if(!a||!a.participants)return;
    if(a.stype!=='event'){
      if(a.participants.length<2)errs.push(`${S.dayNames[d-1]||'Day '+(d-1)}-${s} ${S.names[c]}: 단독`);
      if(a.participants.every(p=>NPCS.includes(p)))errs.push(`${S.dayNames[d-1]||'Day '+(d-1)}-${s}: HO 없음`);
    }
  });
  const u=[...new Set(errs)];
  if(u.length){el.className='vmsg err';el.textContent='⚠ '+u[0]+(u.length>1?` 외 ${u.length-1}건`:'');}
  else{el.className='vmsg ok';el.textContent='✓ 규칙 이상 없음';}
}

/* ═══════════════ ASSIGN MODAL ═══════════════ */
let MS={day:1,slots:[],parts:[],type:'investigate'};
function openAssign(){MS={day:1,slots:[],parts:[]};buildModal();document.getElementById('assignModal').classList.add('open');}
function openAssignFor(c,d,s){
  if(isDeparted(c,d,s)){return;} // 이탈 이후는 클릭 무시
  MS={day:d,slots:[s],parts:[c]};buildModal();document.getElementById('assignModal').classList.add('open');
}
function buildModal(){
  const ds=document.getElementById('mDay');
  ds.innerHTML=Array.from({length:S.days},(_,i)=>`<option value="${i+1}"${i+1===MS.day?' selected':''}>${S.dayNames[i]||'Day '+i}</option>`).join('');
  ds.onchange=()=>{MS.day=+ds.value;rebuildSlots();rebuildParts();};
  const ps=document.getElementById('mPlace');
  ps.innerHTML=S.places.length?S.places.map(p=>`<option>${p.name}</option>`).join(''):'<option value="">— 장소 없음 —</option>';
  document.getElementById('mAction').value='';
  document.getElementById('merr').textContent='';
  setScheduleType(MS.type||'investigate');
  rebuildSlots();rebuildParts();
}
function mDayChange(){MS.day=+document.getElementById('mDay').value;rebuildSlots();rebuildParts();}
function rebuildSlots(){
  const n=slotsOf(MS.day);
  const SYMS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
  document.getElementById('mSlots').innerHTML=Array.from({length:n},(_,i)=>i+1).map(s=>`<button class="tog${MS.slots.includes(s)?' sel':''}" onclick="togSlot(${s})">${SYMS[s-1]||s}</button>`).join('');
}
function togSlot(s){MS.slots=MS.slots.includes(s)?MS.slots.filter(x=>x!==s):[...MS.slots,s];rebuildSlots();rebuildParts();}
function setScheduleType(type){
  MS.type=type;
  const ib=document.getElementById('typeInvestBtn');
  const eb=document.getElementById('typeEventBtn');
  const pl=document.getElementById('partsLabel');
  if(!ib||!eb)return;
  if(type==='investigate'){
    ib.className='tog sel';eb.className='tog';
    if(pl)pl.textContent='참가자 (HO 포함 2인 이상)';
  } else {
    eb.className='tog sel';ib.className='tog';

async function selectImageFolder(){
  if(window.showDirectoryPicker){
    try{
      const dir=await window.showDirectoryPicker({mode:'read'});
      let matched=0;
      for await(const entry of dir.values()){
        if(entry.kind!=='file')continue;
        const fname=entry.name;
        if(!/\.(png|jpg|jpeg|webp|gif)$/i.test(fname))continue;
        const file=await entry.getFile();
        for(const c of ALL){
          const miniPat=new RegExp(`^${c}_mini\\.(png|jpg|jpeg|webp|gif)$`,'i');
          const portPat=new RegExp(`^${c}\\.(png|jpg|jpeg|webp|gif)$`,'i');
          if(miniPat.test(fname)){await readFileToState(file,'tokens',c);matched++;break;}
          else if(portPat.test(fname)){await readFileToState(file,'portraits',c);matched++;break;}
        }
      }
      const st=document.getElementById('folderStatus');
      st.textContent=matched>0?`✓ ${matched}개 로드됨`:'매칭 파일 없음';
      st.style.color=matched>0?'var(--green)':'var(--red)';
      renderSidebar();renderSchedule();if(S.showTok)redrawMap();
    }catch(e){if(e.name!=='AbortError')alert('폴더 접근 오류: '+e.message);}
    return;
  }
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';input.multiple=true;input.setAttribute('webkitdirectory','');
  input.onchange=async()=>{
    const files=[...input.files];let matched=0;
    for(const file of files){
      const fname=file.name;
      for(const c of ALL){
        const miniPat=new RegExp(`^${c}_mini\\.(png|jpg|jpeg|webp|gif)$`,'i');
        const portPat=new RegExp(`^${c}\\.(png|jpg|jpeg|webp|gif)$`,'i');
        if(miniPat.test(fname)){await readFileToState(file,'tokens',c);matched++;break;}
        else if(portPat.test(fname)){await readFileToState(file,'portraits',c);matched++;break;}
      }
    }
    showSaveStatus(matched>0?`✓ ${matched}개 로드됨`:'매칭 파일 없음',matched>0?'var(--green)':'var(--red)');
    renderSidebar();renderSchedule();if(S.showTok)redrawMap();
  };
  input.click();
}
function readFileToState(file,field,code){

}

/* ═══════════════ MAP ═══════════════ */
function addMaps(ev){
  const files=[...ev.target.files];let cnt=files.length,loaded=0;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        S.maps.push({key:mkKey(),name:f.name.replace(/\.[^.]+$/,''),img,dataURL:e.target.result});
        loaded++;
        if(loaded===cnt){S.curMapIdx=S.maps.length-1;renderMapTabs();switchMapTo(S.curMapIdx);}
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(f);
  });
  ev.target.value='';
}

function deleteMap(){

function redrawMap(){
  const canvas=document.getElementById('mapCanvas');
  if(!canvas.width||!S.maps[S.curMapIdx])return;
  const ctx=canvas.getContext('2d');
  const m=S.maps[S.curMapIdx];
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(m.img,0,0,canvas.width,canvas.height);
  S.places.filter(p=>p.mapIdx===S.curMapIdx).forEach(pl=>{
    if(pl.nx==null) normPlace(pl);
    else if(!isMoveMode&&!isResizeMode){pl.x=pl.nx*canvas.width;pl.y=pl.ny*canvas.height;pl.w=pl.nw*canvas.width;pl.h=pl.nh*canvas.height;}
  });
  S.places.filter(p=>p.mapIdx===S.curMapIdx).forEach(pl=>{
    const col=pCol(pl.name);
    ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([4,2]);
    ctx.strokeRect(pl.x,pl.y,pl.w,pl.h);
    ctx.fillStyle=col+'2a';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
    ctx.setLineDash([]);
    plLabel(ctx,pl,canvas,col);
    // 8방향 리사이즈 핸들 (편집 모드일 때만)
    if(S.editMode){
      const hw=pl.w/2,hh=pl.h/2;
      [[pl.x,pl.y],[pl.x+hw,pl.y],[pl.x+pl.w,pl.y],[pl.x+pl.w,pl.y+hh],
       [pl.x+pl.w,pl.y+pl.h],[pl.x+hw,pl.y+pl.h],[pl.x,pl.y+pl.h],[pl.x,pl.y+hh]
      ].forEach(([hx,hy])=>{
        ctx.beginPath();ctx.arc(hx,hy,HANDLE_R,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill();
        ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
      });
    }
    ctx.restore();
  });
  if(S.showTok){
    const placeChars={};
    const dFrom=S.curMapDay>0?S.curMapDay:1;
    const dTo=S.curMapDay>0?S.curMapDay:S.days;
    for(let d=dFrom;d<=dTo;d++)for(let s=1;s<=slotsOf(d);s++)ALL.forEach(c=>{
      const a=getA(c,d,s);if(a&&a.place){if(!placeChars[a.place])placeChars[a.place]=new Set();placeChars[a.place].add(c);}
    });
    S.places.filter(p=>p.mapIdx===S.curMapIdx).forEach(pl=>{
      const chars=placeChars[pl.name]?[...placeChars[pl.name]]:[];
      if(!chars.length)return;
      const tok_r=20,gap=3;
      const startX=pl.x+4,startY=pl.y+pl.h-tok_r*2-4;
      chars.forEach((c,i)=>{
        const tx=startX+(tok_r*2+gap)*i,ty=startY;
        const tokSrc=S.tokens[c]||S.portraits[c];
        if(tokSrc){
          const tImg=new Image();tImg.src=tokSrc;
          ctx.save();ctx.beginPath();ctx.arc(tx+tok_r,ty+tok_r,tok_r,0,Math.PI*2);ctx.clip();
          ctx.drawImage(tImg,tx,ty,tok_r*2,tok_r*2);ctx.restore();
          ctx.beginPath();ctx.arc(tx+tok_r,ty+tok_r,tok_r,0,Math.PI*2);
          ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
        } else {
          ctx.save();ctx.beginPath();ctx.arc(tx+tok_r,ty+tok_r,tok_r,0,Math.PI*2);
          ctx.fillStyle=isHO(c)?'#fdf3e3':'#eef2fb';ctx.fill();
          ctx.strokeStyle=isHO(c)?'#c8954a':'#4c7ec9';ctx.lineWidth=1.5;ctx.stroke();
          ctx.fillStyle=isHO(c)?'#8b5e2a':'#2a5a9b';
          ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(charSc(c),tx+tok_r,ty+tok_r+1);ctx.restore();
        }
      });
    });
  }
  if(dRect){
    ctx.save();ctx.strokeStyle='var(--accent)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
    ctx.strokeRect(dRect.x,dRect.y,dRect.w,dRect.h);ctx.setLineDash([]);ctx.restore();
  }
}
let isDrag=false,dragP={x:0,y:0},dRect=null;
/* ── 맵 확대/축소 · 이동 ── */
let MZS=1,mzsPts=new Map(),mzsPinch=null,mzsPan=null,isLabelMode=false,labelPlace=null,lblOffX=0,lblOffY=0;
function mzsZoom(f,fx,fy){
  const wrap=document.getElementById('mapWrap'),c=document.getElementById('mapCanvas');if(!c||!S.maps[S.curMapIdx])return;
  const r=c.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
  const ax=fx!=null?fx:wr.left+wr.width/2,ay=fy!=null?fy:wr.top+wr.height/2;   // 화면에서 고정할 점
  const nx=(ax-r.left)/r.width,ny=(ay-r.top)/r.height;
  MZS=f===0?1:Math.max(1,Math.min(6,MZS*f));fitCanvas();redrawMap();
  if(MZS>1){const r2=c.getBoundingClientRect();wrap.scrollLeft+=(r2.left+nx*r2.width)-ax;wrap.scrollTop+=(r2.top+ny*r2.height)-ay;}
}
/* 장소 이름표: 보일 글자(줄바꿈) · 위치 · 글자색 · 배경 */
function plLabel(ctx,pl,cv,col){
  const lines=String(pl.lbl||pl.name).split('\n'),fs=12,lh=fs+3;ctx.font=`bold ${fs}px "Courier New",sans-serif`;
  const tw=Math.max(...lines.map(t=>ctx.measureText(t).width)),bw=tw+8,bh=lines.length*lh+4;
  let x=pl.x+(pl.lox!=null?pl.lox*cv.width:2),y=pl.y+(pl.loy!=null?pl.loy*cv.height:2);
  x=Math.max(0,Math.min(cv.width-bw,x));y=Math.max(0,Math.min(cv.height-bh,y));
  if(pl.lb&&pl.lb!=='none'){ctx.fillStyle=pl.lb+'dd';ctx.fillRect(x,y,bw,bh);}
  ctx.fillStyle=pl.lc||col;ctx.textBaseline='top';lines.forEach((t,i)=>ctx.fillText(t,x+4,y+3+i*lh));ctx.textBaseline='alphabetic';
  if(S.editMode){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.strokeRect(x+.5,y+.5,bw-1,bh-1);ctx.setLineDash([]);}
  pl._lb={x,y,w:bw,h:bh};
}
// 이동 드래그 상태
let isMoveMode=false,movingPlace=null,moveOffX=0,moveOffY=0;
// 리사이즈 상태
let isResizeMode=false,resizingPlace=null,resizeHandle=null;
const HANDLE_R=6; // 핸들 반지름 (px)
let lastPT='mouse';
function setTouchAction(){const c=document.getElementById('mapCanvas');if(c)c.style.touchAction=(S.drawMode||S.editMode)?'none':'auto';}

function getResizeHandle(pl,cx,cy){
  // 8방향 핸들 반환: 'nw','n','ne','e','se','s','sw','w' or null
  const {x,y,w,h}=pl;
  const mx=x+w/2,my=y+h/2;
  const pts={nw:[x,y],n:[mx,y],ne:[x+w,y],e:[x+w,my],se:[x+w,y+h],s:[mx,y+h],sw:[x,y+h],w:[x,my]};
  for(const[dir,[hx,hy]] of Object.entries(pts)){
    const tol=lastPT==='mouse'?HANDLE_R+2:16;
    if(Math.abs(cx-hx)<=tol&&Math.abs(cy-hy)<=tol)return dir;
  }
  return null;
}
function isInsidePlace(pl,cx,cy){
  return cx>pl.x+HANDLE_R&&cx<pl.x+pl.w-HANDLE_R&&cy>pl.y+HANDLE_R&&cy<pl.y+pl.h-HANDLE_R;
}
function getResizeCursor(handle){
  const map={nw:'nw-resize',n:'n-resize',ne:'ne-resize',e:'e-resize',se:'se-resize',s:'s-resize',sw:'sw-resize',w:'w-resize'};
  return map[handle]||'default';
}

function toggleDraw(){
  if(!S.maps.length){alert('먼저 맵 이미지를 추가하세요.');return;}
  S.drawMode=!S.drawMode;
  if(S.drawMode){S.editMode=false;document.getElementById('editBtn').className='btn sm';}
  document.getElementById('drawBtn').className='btn sm'+(S.drawMode?' active-state':'');
  document.getElementById('drawHint').textContent=S.drawMode?'드래그로 장소 영역 선택...':S.editMode?'편집 모드: 드래그=이동 / 핸들=크기조절':'';
  setTouchAction();
  if(!S.drawMode)redrawMap();
}
function toggleEditMode(){
  if(!S.maps.length){alert('먼저 맵 이미지를 추가하세요.');return;}
  S.editMode=!S.editMode;
  if(S.editMode){S.drawMode=false;document.getElementById('drawBtn').className='btn sm';}
  document.getElementById('editBtn').className='btn sm'+(S.editMode?' active-state':'');
  document.getElementById('drawHint').textContent=S.editMode?'편집 모드: 드래그=이동 / 핸들=크기조절':'';
  mc.style.cursor=S.editMode?'default':'crosshair';
  setTouchAction();

}
function showTokens(){S.showTok=!S.showTok;document.getElementById('tokenBtn').className='btn sm'+(S.showTok?' active-state':'');redrawMap();}
function setMapDay(val){S.curMapDay=+val;redrawMap();}
function updateMapDaySelect(){
  const sel=document.getElementById('mapDaySelect');
  if(!sel)return;
  sel.innerHTML='<option value="0">전체 Day</option>'+
    Array.from({length:S.days},(_,i)=>`<option value="${i+1}"${S.curMapDay===i+1?' selected':''}>${S.dayNames[i]||'Day '+i}</option>`).join('');

function clearRegions(){if(!confirm('현재 맵의 모든 영역 삭제?'))return;S.places=S.places.filter(p=>p.mapIdx!==S.curMapIdx);redrawMap();renderPlaces();}
const mc=document.getElementById('mapCanvas');

mc.addEventListener('pointerdown',e=>{
  lastPT=e.pointerType||'mouse';
  if(lastPT!=='mouse'&&(S.drawMode||S.editMode))e.preventDefault();
  try{mc.setPointerCapture(e.pointerId);}catch(_){}
  const r=mc.getBoundingClientRect();
  const cx=e.clientX-r.left,cy=e.clientY-r.top;
  mzsPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mzsPts.size===2){const [a,b]=[...mzsPts.values()];mzsPinch={d:Math.hypot(a.x-b.x,a.y-b.y)};isDrag=false;dRect=null;isMoveMode=false;isResizeMode=false;isLabelMode=false;mzsPan=null;redrawMap();return;}

  if(S.drawMode){
    // 그리기 모드: 새 영역 그리기
    isDrag=true;dragP={x:cx,y:cy};dRect={x:cx,y:cy,w:0,h:0};
    return;
  }

  // 편집 모드일 때만 이동/리사이즈
  if(S.editMode){
    const curPlaces=S.places.filter(p=>p.mapIdx===S.curMapIdx);
    for(let i=curPlaces.length-1;i>=0;i--){const pl=curPlaces[i],b=pl._lb;   // 이름표 끌기
      if(b&&cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h){isLabelMode=true;labelPlace=pl;lblOffX=cx-b.x;lblOffY=cy-b.y;document.getElementById('mapTooltip').style.display='none';return;}}
    for(let i=curPlaces.length-1;i>=0;i--){
      const pl=curPlaces[i];
      const handle=getResizeHandle(pl,cx,cy);
      if(handle){
        isResizeMode=true;resizingPlace=pl;resizeHandle=handle;
        dragP={x:cx,y:cy};
        document.getElementById('mapTooltip').style.display='none';
        return;
      }
    }
    for(let i=curPlaces.length-1;i>=0;i--){
      const pl=curPlaces[i];
      if(isInsidePlace(pl,cx,cy)){
        isMoveMode=true;movingPlace=pl;
        moveOffX=cx-pl.x;moveOffY=cy-pl.y;
        document.getElementById('mapTooltip').style.display='none';
        return;
      }
    }
  }
  if(MZS>1){const w=document.getElementById('mapWrap');mzsPan={x:e.clientX,y:e.clientY,sl:w.scrollLeft,st:w.scrollTop,moved:false};}
  if(lastPT!=='mouse')onMapMove(e);
});
mc.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();mzsZoom(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY);},{passive:false});

function onMapMove(e){
  const r=mc.getBoundingClientRect();const cx=e.clientX-r.left,cy=e.clientY-r.top;
  if(mzsPts.has(e.pointerId))mzsPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mzsPinch&&mzsPts.size===2){const [a,b]=[...mzsPts.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(mzsPinch.d>0&&Math.abs(d/mzsPinch.d-1)>.03){mzsZoom(d/mzsPinch.d,(a.x+b.x)/2,(a.y+b.y)/2);mzsPinch.d=d;}return;}
  if(isLabelMode&&labelPlace){const canvas=document.getElementById('mapCanvas');labelPlace.lox=(cx-lblOffX-labelPlace.x)/canvas.width;labelPlace.loy=(cy-lblOffY-labelPlace.y)/canvas.height;redrawMap();return;}
  if(mzsPan&&!isDrag&&!isMoveMode&&!isResizeMode){const w=document.getElementById('mapWrap'),dx=e.clientX-mzsPan.x,dy=e.clientY-mzsPan.y;if(Math.hypot(dx,dy)>4)mzsPan.moved=true;if(mzsPan.moved){w.scrollLeft=mzsPan.sl-dx;w.scrollTop=mzsPan.st-dy;document.getElementById('mapTooltip').style.display='none';return;}}

  // 새 영역 그리기
  if(isDrag){
    dRect={x:Math.min(dragP.x,cx),y:Math.min(dragP.y,cy),w:Math.abs(cx-dragP.x),h:Math.abs(cy-dragP.y)};
    redrawMap();return;
  }

  // 이동
  if(isMoveMode&&movingPlace){
    const canvas=document.getElementById('mapCanvas');
    movingPlace.x=Math.max(0,Math.min(cx-moveOffX,canvas.width-movingPlace.w));
    movingPlace.y=Math.max(0,Math.min(cy-moveOffY,canvas.height-movingPlace.h));
    normPlace(movingPlace);redrawMap();return;
  }

  // 리사이즈
  if(isResizeMode&&resizingPlace){
    const pl=resizingPlace,h=resizeHandle;
    const dx=cx-dragP.x,dy=cy-dragP.y;
    dragP={x:cx,y:cy};
    const MIN=20;
    if(h.includes('e')){pl.w=Math.max(MIN,pl.w+dx);}
    if(h.includes('s')){pl.h=Math.max(MIN,pl.h+dy);}
    if(h.includes('w')){const nw=Math.max(MIN,pl.w-dx);pl.x+=pl.w-nw;pl.w=nw;}
    if(h.includes('n')){const nh=Math.max(MIN,pl.h-dy);pl.y+=pl.h-nh;pl.h=nh;}
    normPlace(pl);redrawMap();return;
  }

  // 커서 변경 (편집 모드일 때만)
  const tt=document.getElementById('mapTooltip');
  if(S.editMode){
    const curPlaces=S.places.filter(p=>p.mapIdx===S.curMapIdx);
    let cursor='default';
    for(let i=curPlaces.length-1;i>=0;i--){
      const pl=curPlaces[i];
      const handle=getResizeHandle(pl,cx,cy);
      if(handle){cursor=getResizeCursor(handle);break;}
      if(isInsidePlace(pl,cx,cy)){cursor='move';break;}
    }
    mc.style.cursor=cursor;
  }

  // 툴팁 (이동/리사이즈 중 아닐 때만)
  const hit=S.places.filter(p=>p.mapIdx===S.curMapIdx).find(p=>cx>=p.x&&cx<=p.x+p.w&&cy>=p.y&&cy<=p.y+p.h);
  if(hit&&!S.drawMode){
    const chars=getCharsForPlace(hit.name);
    const htmChars=chars.length?chars.map(c=>`<div class="tt-token">${tokenTag(c,16)}<span>${S.names[c]}</span></div>`).join(''):'<span style="color:var(--text3);font-size:10px;">배정 없음</span>';
    tt.innerHTML=`<h4 style="color:${pCol(hit.name)};">📍 ${hit.name}</h4><div class="tt-tokens">${htmChars}</div>`;
    const wrapR=document.getElementById('mapWrap').getBoundingClientRect();
    let tx=e.clientX-wrapR.left+12,ty=e.clientY-wrapR.top+12;
    if(tx+215>wrapR.width)tx=e.clientX-wrapR.left-220;
    tt.style.left=tx+'px';tt.style.top=ty+'px';tt.style.display='block';
  } else tt.style.display='none';
}
mc.addEventListener('pointermove',onMapMove);

mc.addEventListener('pointerleave',e=>{
  if(e.pointerType&&e.pointerType!=='mouse')return;
  document.getElementById('mapTooltip').style.display='none';
  if(isMoveMode){isMoveMode=false;movingPlace=null;renderPlaces();}
  if(isResizeMode){isResizeMode=false;resizingPlace=null;renderPlaces();}
});

mc.addEventListener('pointercancel',e=>{mzsPts.delete(e.pointerId);mzsPinch=null;mzsPan=null;isLabelMode=false;labelPlace=null;isDrag=false;dRect=null;isMoveMode=false;movingPlace=null;isResizeMode=false;resizingPlace=null;redrawMap();});
mc.addEventListener('pointerup',e=>{
  mzsPts.delete(e.pointerId);if(mzsPts.size<2)mzsPinch=null;mzsPan=null;
  if(isLabelMode){isLabelMode=false;labelPlace=null;renderPlaces();return;}
  if(isDrag){
    isDrag=false;
    if(dRect&&dRect.w>8&&dRect.h>8){
      const name=prompt('이 영역의 장소명:');
      if(name&&name.trim()){
        const nm=name.trim();
        const exist=S.places.find(p=>p.name===nm);
        if(exist){exist.mapIdx=S.curMapIdx;exist.x=dRect.x;exist.y=dRect.y;exist.w=dRect.w;exist.h=dRect.h;normPlace(exist);}
        else {const np={name:nm,mapIdx:S.curMapIdx,...dRect};normPlace(np);S.places.push(np);}
        renderPlaces();
      }
    }
    dRect=null;redrawMap();S.drawMode=false;setTouchAction();
    document.getElementById('drawBtn').className='btn sm';
    document.getElementById('drawHint').textContent='영역 위 드래그=이동 / 모서리=크기조절';
    return;
  }
  if(isMoveMode){isMoveMode=false;movingPlace=null;renderPlaces();}
  if(isResizeMode){isResizeMode=false;resizingPlace=null;renderPlaces();}
});
function getCharsForPlace(placeName){
  const set=new Set();
  for(let d=1;d<=S.days;d++)for(let s=1;s<=slotsOf(d);s++)ALL.forEach(c=>{const a=getA(c,d,s);if(a&&a.place===placeName)set.add(c);});
  return[...set];
}

// 폴더 열림 상태
const _folderOpen={};
function renderPlaces(){
  const d=document.getElementById('placeList');
  if(!S.places.length){d.innerHTML='<div style="color:var(--text3);font-size:11px;text-align:center;padding:8px;">없음</div>';return;}

  // 폴더별로 그룹화 (undefined → '' 로 처리)
  const groups={};
  S.places.forEach((p,i)=>{
    const folder=p.folder||'';
    if(!groups[folder])groups[folder]=[];
    groups[folder].push({p,i});
  });

  let html='';
  // 폴더 없는 항목 먼저
  if(groups['']){
    html+=groups[''].map(({p,i})=>placeItemHtml(p,i)).join('');
  }
  // 폴더별 그룹
  Object.entries(groups).filter(([k])=>k!=='').forEach(([folder,items])=>{
    const open=_folderOpen[folder]!==false; // 기본 열림
    html+=`<div class="folder-group">

/* ═══════════════ (3) SETTINGS PANEL ═══════════════ */
/* ═══════════════ HSL COLOR UTILS ═══════════════ */
function hexToHsl(hex){
  let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}else{
    const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}
  }
  return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
}
function hslToHex(h,s,l){
  s/=100;l/=100;
  const k=n=>(n+h/30)%12;
  const a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  const toHex=v=>Math.round(f(v)*255).toString(16).padStart(2,'0');
  return`#${toHex(0)}${toHex(8)}${toHex(4)}`;
}
function buildHslPicker(key,hsl,hexVal){
  const {h,s,l}=hsl;
  const hGrad=`linear-gradient(to right,hsl(0,${s}%,${l}%),hsl(30,${s}%,${l}%),hsl(60,${s}%,${l}%),hsl(90,${s}%,${l}%),hsl(120,${s}%,${l}%),hsl(150,${s}%,${l}%),hsl(180,${s}%,${l}%),hsl(210,${s}%,${l}%),hsl(240,${s}%,${l}%),hsl(270,${s}%,${l}%),hsl(300,${s}%,${l}%),hsl(330,${s}%,${l}%),hsl(360,${s}%,${l}%))`;
  const sGrad=`linear-gradient(to right,hsl(${h},0%,${l}%),hsl(${h},100%,${l}%))`;
  const lGrad=`linear-gradient(to right,hsl(${h},${s}%,0%),hsl(${h},${s}%,50%),hsl(${h},${s}%,100%))`;
  return`<div class="hsl-picker">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">
      <div class="hsl-preview" id="thprev_${key}" style="background:${hexVal};"></div>
      <input type="text" id="thhex_${key}" value="${hexVal}"
        style="width:76px;font-size:11px;color:var(--text2);font-family:var(--font);background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:2px 5px;"
        oninput="applyHexInput('${key}',this.value)"
        onblur="normalizeHexInput('${key}',this.value)"
        placeholder="#rrggbb">
    </div>
    <div class="hsl-row">
      <span class="hsl-label">H</span>
      <input type="range" class="hsl-slider" id="th_h_${key}" min="0" max="360" value="${h}"
        style="background:${hGrad};"
        oninput="document.getElementById('th_hv_${key}').textContent=this.value;updateThemeFromHsl('${key}')">
      <span class="hsl-val" id="th_hv_${key}">${h}</span>
    </div>
    <div class="hsl-row">
      <span class="hsl-label">S</span>
      <input type="range" class="hsl-slider" id="th_s_${key}" min="0" max="100" value="${s}"
        style="background:${sGrad};"
        oninput="document.getElementById('th_sv_${key}').textContent=this.value;updateThemeFromHsl('${key}')">
      <span class="hsl-val" id="th_sv_${key}">${s}</span>
    </div>
    <div class="hsl-row">
      <span class="hsl-label">L</span>
      <input type="range" class="hsl-slider" id="th_l_${key}" min="0" max="100" value="${l}"
        style="background:${lGrad};"
        oninput="document.getElementById('th_lv_${key}').textContent=this.value;updateThemeFromHsl('${key}')">
      <span class="hsl-val" id="th_lv_${key}">${l}</span>
    </div>
  </div>`;
}
function updateHslSliderBg(key,h,s,l){
  const hEl=document.getElementById('th_h_'+key);
  const sEl=document.getElementById('th_s_'+key);
  const lEl=document.getElementById('th_l_'+key);

function applyHexInput(key,val){
  // #으로 시작하는 유효한 hex면 즉시 적용
  const clean=val.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(clean)){
    const hsl=hexToHsl(clean);
    const hEl=document.getElementById('th_h_'+key);
    const sEl=document.getElementById('th_s_'+key);
    const lEl=document.getElementById('th_l_'+key);
    if(hEl){hEl.value=hsl.h;document.getElementById('th_hv_'+key).textContent=hsl.h;}
    if(sEl){sEl.value=hsl.s;document.getElementById('th_sv_'+key).textContent=hsl.s;}
    if(lEl){lEl.value=hsl.l;document.getElementById('th_lv_'+key).textContent=hsl.l;}
    updateHslSliderBg(key,hsl.h,hsl.s,hsl.l);
    if(key==='place'){S._editColor=clean;document.getElementById('thprev_place').style.background=clean;}
    else if(key==='headerBg'||key==='headerText'){updateHeaderColor(key,clean);}
    else{updateThemeColor(key,clean);}
  }
  // 미완성 입력 중엔 프리뷰만 색 보정 시도
  else if(/^#[0-9a-fA-F]{3}$/.test(clean)){
    const full='#'+clean[1]+clean[1]+clean[2]+clean[2]+clean[3]+clean[3];
    document.getElementById('thprev_'+key).style.background=full;
  }
}

      if(!data.version)throw new Error('올바른 스케줄러 파일이 아닙니다.');
      const restoredMaps=await Promise.all((data.maps||[]).map(m=>new Promise(res=>{

      S.dayNames=data.dayNames??Array.from({length:S.days},(_,i)=>'Day '+i);
      S.names=data.names??{};S.portraits=data.portraits??{};S.tokens=data.tokens??{};
      S.places=data.places??[];S.schedule=data.schedule??{};
      S.pcIdx=data.pcIdx??{};S.customColors=data.customColors??{};S.departures=data.departures??{};S.condEvents=data.condEvents??[];
      S.maps=restoredMaps;S.curMapIdx=0;

/* ═══════════════ CONDITIONAL EVENTS ═══════════════ */
const CEV_COLORS=['#d4924c','#4caa7e','#4c7ec9','#9b6ec9','#c94c6a','#4caaa0','#c9b04c','#6a9bc9'];
let _cevEditId=null;

// 달성 여부 계산
function calcCevStatus(ev){
  // 범위 내 해당 장소 조사 슬롯 수집
  const matches=[];
  for(let d=ev.dayFrom;d<=Math.min(ev.dayTo,S.days);d++){
    for(let s=1;s<=slotsOf(d);s++){
      ALL.forEach(c=>{
        const a=getA(c,d,s);
        if(a&&a.place===ev.place&&a.stype!=='event'){
          // gid 기준 중복 제거
          if(!matches.find(m=>m.gid===a.gid&&m.d===d&&m.s===s)){
            matches.push({d,s,gid:a.gid,chars:a.participants});
          }
        }
      });
    }
  }
  // 중복 제거
  const uniq=[];
  const seen=new Set();
  matches.forEach(m=>{const k=`${m.d}_${m.s}_${m.gid}`;if(!seen.has(k)){seen.add(k);uniq.push(m);}});
  const needed=ev.condType==='count'?(ev.count||1):1;
  const got=uniq.length;
  return{got, needed, achieved:got>=needed, slots:uniq};
}

function renderCevPanel(){
  const panel=document.getElementById('cevPanel');
  const summary=document.getElementById('cevSummary');
  if(!S.condEvents.length){
    panel.innerHTML='<div style="color:var(--text3);font-size:13px;text-align:center;padding:30px;">등록된 조건부 이벤트가 없습니다.<br>+ 이벤트 등록 버튼으로 추가하세요.</div>';
    if(summary)summary.textContent='';
    renderCevBanner();return;
  }
  let achieved=0;
  panel.innerHTML=S.condEvents.map(ev=>{
    const st=calcCevStatus(ev);
    if(st.achieved)achieved++;
    const statusCls=st.achieved?'achieved':st.got>0?'partial':'pending';
    const statusTxt=st.achieved?'✓ 달성':st.got>0?`${st.got}/${st.needed} 진행중`:'미달성';
    const col=ev.color||CEV_COLORS[0];
    const pct=Math.min(100,Math.round(st.got/st.needed*100));
    const dayFromName=S.dayNames[ev.dayFrom-1]||('Day '+(ev.dayFrom-1));
    const dayToName=S.dayNames[ev.dayTo-1]||('Day '+(ev.dayTo-1));
    // 달성 슬롯 표시
    const slotMarks=st.slots.map(m=>{
      const dn=S.dayNames[m.d-1]||('Day '+(m.d-1));
      const SYMS=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
      const chars=m.chars.map(c=>S.names[c]).join(', ');
      return`<span class="cev-slot-mark" style="background:${col}18;border:1px solid ${col}55;color:${col};">${dn} ${SYMS[m.s-1]||m.s} · ${chars}</span>`;
    }).join('');
    return`<div class="cev-block" style="border-left:3px solid ${col};">
      <div class="cev-head">
        <div class="cev-status ${statusCls}"></div>
        <div class="cev-title">${ev.name}</div>
        <span style="font-size:11px;color:${st.achieved?'var(--green)':st.got>0?'var(--accent)':'var(--text3)'};">${statusTxt}</span>
        <button onclick="openCevModal('${ev.id}')" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--text3);padding:0 3px;" title="편집">✏</button>
        <button onclick="deleteCev('${ev.id}')" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--red);padding:0 3px;" title="삭제">×</button>
      </div>
      <div class="cev-body">
        <div class="cev-cond-row">
          <span class="cev-cond-tag" style="background:${col}18;border-color:${col}55;color:${col};">📍 ${ev.place}</span>
          <span class="cev-cond-tag">🗓 ${dayFromName} ~ ${dayToName}</span>
          <span class="cev-cond-tag">${ev.condType==='count'?`${ev.count}회 이상 조사`:'1회 이상 조사'}</span>
        </div>
        <div class="cev-progress"><div class="cev-progress-bar" style="width:${pct}%;background:${col};"></div></div>
        ${slotMarks?`<div style="display:flex;flex-wrap:wrap;gap:2px;">${slotMarks}</div>`:'<div style="color:var(--text3);font-size:10px;">조사 없음</div>'}
        ${ev.note?`<div style="font-size:11px;color:var(--text2);">💬 ${ev.note}</div>`:''}
      </div>
    </div>`;
  }).join('');
  if(summary)summary.textContent=`${achieved} / ${S.condEvents.length} 달성`;
  renderCevBanner();
}

function renderCevBanner(){
  let banner=document.getElementById('cevBanner');
  if(!banner){
    const wrap=document.getElementById('panel-schedule');
    banner=document.createElement('div');banner.id='cevBanner';banner.className='cev-banner';
    wrap.insertBefore(banner,wrap.firstChild);
  }
  if(!S.condEvents.length){banner.style.display='none';return;}
  banner.style.display='flex';
  banner.innerHTML='<span style="font-size:11px;color:var(--text2);flex-shrink:0;">조건 이벤트:</span>'+
    S.condEvents.map(ev=>{
      const st=calcCevStatus(ev);
      const cls=st.achieved?'achieved':st.got>0?'partial':'pending';
      const icon=st.achieved?'✓':st.got>0?'◑':'○';
      const col=ev.color||CEV_COLORS[0];
      return`<div class="cev-badge ${cls}" style="${st.achieved?`color:var(--green);border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)`:st.got>0?`color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)`:`color:var(--text3);border-color:var(--border);background:var(--bg3)`}"
        onclick="switchTab('events',document.querySelector('.tab-btn:nth-child(4)'));" title="${ev.place} · ${st.got}/${st.needed}">
        ${icon} ${ev.name}
      </div>`;
    }).join('');
}

// 모달 열기
function openCevModal(id=null){
  _cevEditId=id;
  const ev=id?S.condEvents.find(e=>e.id===id):null;
  document.getElementById('cevModalTitle').textContent=id?'이벤트 편집':'조건부 이벤트 등록';
  document.getElementById('cevName').value=ev?ev.name:'';
  document.getElementById('cevNote').value=ev?ev.note||'':'';
  // 장소 옵션
  const ps=document.getElementById('cevPlace');
  ps.innerHTML=S.places.length?S.places.map(p=>`<option${ev&&ev.place===p.name?' selected':''}>${p.name}</option>`).join(''):'<option>장소 없음</option>';
  // Day 옵션
  const makeOpts=(selVal)=>Array.from({length:S.days},(_,i)=>`<option value="${i+1}"${i+1===selVal?' selected':''}>${S.dayNames[i]||'Day '+i}</option>`).join('');
  document.getElementById('cevDayFrom').innerHTML=makeOpts(ev?ev.dayFrom:1);
  document.getElementById('cevDayTo').innerHTML=makeOpts(ev?ev.dayTo:S.days);
  // 조건 타입
  document.querySelectorAll('input[name=cevCondType]').forEach(r=>{r.checked=r.value===(ev?ev.condType:'any');});
  document.getElementById('cevCount').value=ev?ev.count||1:1;
  // 색상 피커
  const curCol=ev?ev.color:CEV_COLORS[0];
  document.getElementById('cevColorPicker').innerHTML=CEV_COLORS.map(col=>
    `<div onclick="selectCevColor('${col}')" style="width:20px;height:20px;border-radius:50%;background:${col};cursor:pointer;border:2px solid ${col===curCol?'#333':'transparent'};transition:border .1s;" id="cevc_${col.replace('#','')}" title="${col}"></div>`
  ).join('')+`<input type="color" value="${curCol}" style="width:32px;height:28px;border:1px solid var(--border);border-radius:3px;cursor:pointer;padding:1px;" oninput="selectCevColor(this.value)">`;
  window._cevColor=curCol;
  document.getElementById('cevModal').classList.add('open');
}
function selectCevColor(col){
  document.querySelectorAll('#cevColorPicker div').forEach(el=>{el.style.border=el.title===col?'2px solid #333':'2px solid transparent';});
  window._cevColor=col;
}
function confirmCev(){
  const name=document.getElementById('cevName').value.trim();
  const place=document.getElementById('cevPlace').value;
  const dayFrom=+document.getElementById('cevDayFrom').value;
  const dayTo=+document.getElementById('cevDayTo').value;
  const condType=document.querySelector('input[name=cevCondType]:checked').value;
  const count=+document.getElementById('cevCount').value||1;
  const note=document.getElementById('cevNote').value.trim();
  const color=window._cevColor||CEV_COLORS[0];
  if(!name){alert('이벤트 이름을 입력하세요.');return;}
  if(!place||place==='장소 없음'){alert('장소를 선택하세요.');return;}
  if(dayFrom>dayTo){alert('Day 범위가 올바르지 않습니다.');return;}
  if(_cevEditId){
    const ev=S.condEvents.find(e=>e.id===_cevEditId);
    if(ev)Object.assign(ev,{name,place,dayFrom,dayTo,condType,count,note,color});
  } else {
    S.condEvents.push({id:'cev_'+Date.now(),name,place,dayFrom,dayTo,condType,count,note,color});
  }
  closeOverlay('cevModal');renderCevPanel();renderCevBanner();
}
function deleteCev(id){
  if(!confirm('이벤트를 삭제하시겠습니까?'))return;
  S.condEvents=S.condEvents.filter(e=>e.id!==id);
  renderCevPanel();renderCevBanner();
}

/* ═══════════════ TAB ═══════════════ */
function switchTab(t,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  if(btn)btn.classList.add('active');
  if(t==='summary')renderSummary();
  if(t==='settings')renderSettings();
  if(t==='events')renderCevPanel();
  if(t==='map'){renderPlaces();updateMapDaySelect();setTimeout(()=>{fitCanvas();redrawMap();},50);}
}
window.addEventListener('resize',()=>{if(document.getElementById('panel-map').classList.contains('active')){fitCanvas();redrawMap();}});

/* ═══════════════ INIT ═══════════════ */
applyTheme();
updateDayLabel();
renderSchedule();
renderPlaces();
renderCevBanner();

/* ═══════════════ 저택 앱 연동 (index.html 안에서 열렸을 때만 동작) ═══════════════ */
window.PENDING=[];
function _esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
window.__setPending=l=>{window.PENDING=l||[];if(!document.querySelector('.overlay.open'))renderSchedule();};
function mkKey(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function normPlace(pl){const c=document.getElementById('mapCanvas');if(!c||!c.width||!c.height)return;pl.nx=pl.x/c.width;pl.ny=pl.y/c.height;pl.nw=pl.w/c.width;pl.nh=pl.h/c.height;}
function togglePlaceReveal(ev,i){ev.stopPropagation();const p=S.places[i];p.revealed=!p.revealed;renderPlaces();}
function toggleMapReveal(i){S.maps[i].revealed=!S.maps[i].revealed;renderMapTabs();}
function checkBooking(b){
  if(!S.places.find(p=>p.name===b.place))return `장소 "${b.place}"가 스케줄러에 없어요`;
  for(const s of b.slots){
    if(b.day>S.days||s>slotsOf(b.day))return '해당 Day/슬롯이 스케줄러에 없어요';
    for(const c of b.parts){
      if(isDeparted(c,b.day,s))return `${S.names[c]}: 이탈 상태예요`;
      if(getA(c,b.day,s))return `${S.names[c]}: ${S.dayNames[b.day-1]||''} ${s}슬롯에 이미 일정이 있어요`;
    }
  }
  return '';
}
function applyBooking(b){
  const e=checkBooking(b);if(e)return e;
  const gid=Date.now()+Math.random();
  b.slots.forEach(s=>b.parts.forEach(p=>setA(p,b.day,s,{place:b.place,action:b.note||('PL 예약 · '+(b.name||'')),participants:[...b.parts],gid,stype:'investigate'})));
  renderSchedule();if(S.showTok)redrawMap();
  return '';
}
(function(){
  let BR=null;try{BR=(window.parent&&window.parent!==window)?window.parent.KPBridge:null;}catch(e){}
  if(!BR)return;
  const KEYS=['days','slotsPerDay','dayNames','names','places','schedule','departures','condEvents','customColors','pcIdx','tod','now'];
  let last=null,started=false,pending=null,assetSig=null;
  function textState(){const o={};KEYS.forEach(k=>o[k]=S[k]);o.maps=S.maps.map(m=>({key:m.key,name:m.name,revealed:!!m.revealed}));o.appTitle=document.getElementById('appTitle').textContent.trim();return JSON.stringify(o);}
  function sig(){return Object.entries(S.portraits).map(([k,v])=>'p'+k+v.length).join()+'|'+Object.entries(S.tokens).map(([k,v])=>'t'+k+v.length).join();}
  function busy(){return !!document.querySelector('.overlay.open')||isDrag||isMoveMode||isResizeMode||isLabelMode;}
  async function apply(st){
    if(busy()){pending=st;return;}
    pending=null;
    KEYS.forEach(k=>{if(st[k]!==undefined)S[k]=st[k];});
    ALL.forEach(c=>{if(!S.schedule[c])S.schedule[c]={};if(!S.names[c])S.names[c]=c;});
    if(st.appTitle)document.getElementById('appTitle').textContent=st.appTitle;
    const next=[];
    for(const m of (st.maps||[])){
      let loc=S.maps.find(x=>x.key===m.key);
      if(!loc){
        const data=await BR.loadMap(m.key);if(!data)continue;
        loc=await new Promise(res=>{const img=new Image();img.onload=()=>res({key:m.key,name:m.name,img,dataURL:data,uploaded:true});img.onerror=()=>res(null);img.src=data;});
        if(!loc)continue;
      }
      loc.name=m.name;loc.revealed=!!m.revealed;next.push(loc);
    }
    S.maps=next;if(S.curMapIdx>=S.maps.length)S.curMapIdx=0;
    last=textState();
    updateDayLabel();renderSchedule();renderPlaces();renderMapTabs();renderCevPanel();
    if(S.maps.length&&document.getElementById('panel-map').classList.contains('active'))switchMapTo(S.curMapIdx);
  }
  window.__applyRemote=st=>apply(st);
  window.__applyAssets=a=>{
    let ch=false;
    ['portraits','tokens'].forEach(f=>Object.entries((a&&a[f])||{}).forEach(([c,v])=>{if(!S[f][c]){S[f][c]=v;ch=true;}}));
    assetSig=sig();if(ch){renderSidebar();renderSchedule();}
  };
  window.__startSync=()=>{if(started)return;started=true;if(last===null)last='';if(assetSig===null)assetSig=sig();};
  setInterval(()=>{
    if(pending&&!busy())apply(pending);
    if(!started)return;
    S.maps.forEach(m=>{if(!m.key)m.key=mkKey();if(!m.uploaded){m.uploaded=true;BR.uploadMap(m.key,m.name,m.dataURL);}});
    const t=textState();if(t!==last){last=t;BR.saveSched(JSON.parse(t));}
    const sg=sig();if(sg!==assetSig){assetSig=sg;BR.saveAssets(S.portraits,S.tokens);}
  },1500);
  BR.ready(window);
})();
</script>
